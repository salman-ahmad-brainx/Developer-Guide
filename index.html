"motion": `
  <div class="part-kicker">Part 2 — Foundations</div>
  <h1>Motion &amp; transitions</h1>
  <p>Motion isn't decoration — it's feedback. It tells a user whether their click registered, whether new data replaced old data, and whether something they're about to close will lose their work. On a statistical dashboard, badly-timed motion also does real damage: a chart that animates every time its underlying data refreshes turns a monitoring screen into something distracting to look at for eight hours a day.</p>

  <h2>The duration and easing scale</h2>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Three motion durations: micro, standard, and page-level transitions</title>
  <rect width="900" height="210" fill="#FFFFFF"/>
  <text x="40" y="45" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A">Micro &#183; 100&#8211;150ms</text>
  <line x1="200" y1="40" x2="380" y2="40" stroke="#D3D1C7" stroke-width="2"/>
  <circle cx="208" cy="40" r="9" fill="#534AB7" class="m-demo m-fast"/>
  <text x="410" y="45" font-family="Arial" font-size="12" fill="#888780">hover &#183; press &#183; toggle &#8212; ease-out</text>
  <text x="40" y="105" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A">Standard &#183; 200&#8211;250ms</text>
  <line x1="200" y1="100" x2="380" y2="100" stroke="#D3D1C7" stroke-width="2"/>
  <circle cx="208" cy="100" r="9" fill="#3B6D11" class="m-demo m-mid"/>
  <text x="410" y="105" font-family="Arial" font-size="12" fill="#888780">dropdowns &#183; modals &#183; tooltips &#8212; ease-in-out</text>
  <text x="40" y="165" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A">Page-level &#183; 300&#8211;350ms</text>
  <line x1="200" y1="160" x2="380" y2="160" stroke="#D3D1C7" stroke-width="2"/>
  <rect x="200" y="150" width="20" height="20" rx="4" fill="#854F0B" class="m-demo m-slow"/>
  <text x="410" y="165" font-family="Arial" font-size="12" fill="#888780">route changes &#183; panel slides &#8212; ease-in-out</text>
  <text x="40" y="198" font-family="Arial" font-size="11" fill="#B4B2A9">Never exceed 350ms &#8212; past that, motion reads as slow rather than smooth.</text>
  </svg>
  </div>

  <table class="rule-table">
    <tr><th>Type</th><th>Duration</th><th>Used for</th></tr>
    <tr><td>Micro</td><td>100–150ms, ease-out</td><td>Hover, press/active, checkbox/toggle flip</td></tr>
    <tr><td>Standard</td><td>200–250ms, ease-in-out</td><td>Dropdown open/close, modal enter/exit, tooltip appear</td></tr>
    <tr><td>Page-level</td><td>300–350ms, ease-in-out</td><td>Route/tab changes, drawer slide-in, sidebar collapse</td></tr>
  </table>
  <p><strong>Rule:</strong> never exceed 350ms for any UI transition. Past that, motion reads as slow rather than smooth, and on a screen someone checks dozens of times a day, slow feels broken.</p>

  <h2>What should animate vs. what should snap</h2>
  <p><strong>Do</strong> animate: opening/closing overlays (modals, dropdowns, tooltips), a sidebar collapsing, a value that updates in place (a KPI number ticking to its new value over ~300ms rather than jump-cutting), a row appearing after a filter is applied.</p>
  <p><strong>Don't</strong> animate: page load on first visit (show content immediately, use a loading skeleton instead of a fade-in choreography), a chart re-rendering because of a routine data refresh (this should update silently — see the States section's real-time-update rule), or anything on a screen that auto-refreshes more than once a minute — frequent motion on a monitoring screen becomes noise, not feedback.</p>

  <h2>Loading-to-loaded transitions without layout jumps</h2>
  <p>When a skeleton is replaced by real content, the real content must occupy the exact same space the skeleton did. If a card grows or shifts position the instant data arrives, it reads as broken, not as "loaded." Reserve final height/width in the skeleton itself — never let content size be a surprise.</p>

  <div class="callout"><strong>Do:</strong> keep motion purely functional — confirming an action happened, or easing attention from one state to the next.<br><strong>Don't:</strong> add decorative animation (bouncing icons, staggered card entrances, parallax) anywhere on a dashboard — it competes with the data for attention and adds nothing a user needs.</div>

    <h2>Easing &#8212; the shape of the motion</h2>
  <p>Duration sets how long; easing sets how it accelerates. The wrong curve makes even a correctly-timed transition feel off.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Easing curves: ease-out, ease-in-out, and linear</title>
  <rect width="900" height="210" fill="#FFFFFF"/>
  <line x1="70" y1="30" x2="70" y2="170" stroke="#D3D1C7"/>
  <line x1="70" y1="170" x2="420" y2="170" stroke="#D3D1C7"/>
  <text x="60" y="26" font-family="Arial" font-size="10" fill="#888780" text-anchor="end">done</text>
  <text x="60" y="174" font-family="Arial" font-size="10" fill="#888780" text-anchor="end">0</text>
  <text x="245" y="192" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">time &#8594;</text>
  <path class="a-draw" pathLength="1" d="M70 170 C 120 60, 220 40, 420 35" fill="none" stroke="#3B6D11" stroke-width="3"/>
  <path class="a-draw" pathLength="1" d="M70 170 C 190 165, 300 45, 420 35" fill="none" stroke="#534AB7" stroke-width="3"/>
  <path class="a-draw" pathLength="1" d="M70 170 L420 35" fill="none" stroke="#B4B2A9" stroke-width="2.5" stroke-dasharray="5 4"/>
  <rect x="470" y="46" width="14" height="14" rx="3" fill="#3B6D11"/><text x="492" y="58" font-family="Arial" font-size="12" fill="#2C2C2A">ease-out &#8212; things entering</text>
  <rect x="470" y="86" width="14" height="14" rx="3" fill="#534AB7"/><text x="492" y="98" font-family="Arial" font-size="12" fill="#2C2C2A">ease-in-out &#8212; moving between positions</text>
  <rect x="470" y="126" width="14" height="14" rx="3" fill="#B4B2A9"/><text x="492" y="138" font-family="Arial" font-size="12" fill="#2C2C2A">linear &#8212; spinners &amp; progress only</text>
  </svg>
  </div>
  <table class="rule-table">
    <tr><th>Easing</th><th>Feel</th><th>Use for</th></tr>
    <tr><td>ease-out (fast &#8594; slow)</td><td>Responsive; arrives gently</td><td>Elements entering: menus, toasts, hover feedback</td></tr>
    <tr><td>ease-in (slow &#8594; fast)</td><td>Leaves decisively</td><td>Elements exiting the screen</td></tr>
    <tr><td>ease-in-out (slow &#8594; fast &#8594; slow)</td><td>Smooth, balanced</td><td>Moving between two on-screen positions: modals, drawers, tabs</td></tr>
    <tr><td>linear</td><td>Mechanical, constant</td><td>Only continuous indicators &#8212; spinners, progress bars &#8212; never UI transitions</td></tr>
  </table>

  <h2>Number transitions &amp; staggering</h2>
  <p>Two patterns are worth applying deliberately, and easy to overdo:</p>
  <ul>
    <li><strong>Count-up on values</strong> &#8212; when a KPI changes, tween the number to its new value over ~300ms instead of jump-cutting, so the eye registers the change. Skip it on values that refresh every few seconds &#8212; it becomes a permanent flicker.</li>
    <li><strong>Staggering</strong> &#8212; when a list or grid first appears, offset each item by ~30&#8211;40ms for a gentle cascade. Cap the total: past ~6 items, late rows start to feel laggy. Never stagger on every data refresh.</li>
  </ul>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Staggered entrance capped after a few items</title>
  <rect width="900" height="170" fill="#FFFFFF"/>
  <rect x="60"  y="30" width="110" height="100" rx="8" fill="#EDEBFA" class="a-grow" style="animation-delay:0ms"/>
  <rect x="190" y="30" width="110" height="100" rx="8" fill="#EDEBFA" class="a-grow" style="animation-delay:40ms"/>
  <rect x="320" y="30" width="110" height="100" rx="8" fill="#EDEBFA" class="a-grow" style="animation-delay:80ms"/>
  <rect x="450" y="30" width="110" height="100" rx="8" fill="#EDEBFA" class="a-grow" style="animation-delay:120ms"/>
  <rect x="580" y="30" width="110" height="100" rx="8" fill="#EDEBFA" class="a-grow" style="animation-delay:160ms"/>
  <rect x="710" y="30" width="110" height="100" rx="8" fill="#EDEBFA" class="a-grow" style="animation-delay:200ms"/>
  <text x="450" y="152" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">~30&#8211;40ms offset per item, capped at ~6 &#8212; and never on routine refresh</text>
  </svg>
  </div>
  <h2>Skeleton &#8594; content, without a jump</h2>
  <p>Cross-fade the skeleton out and the real content in over ~150ms, and reserve the skeleton at the content&#39;s final dimensions so nothing reflows. A hard swap that also resizes reads as a glitch; a cross-fade at a stable size reads as &quot;loaded.&quot;</p>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="18" width="272" height="68" rx="8" fill="#EFEEE9"/><rect x="24" y="18" width="272" height="68" rx="8" fill="#2C2C2A" opacity="0.22"/><rect x="98" y="30" width="124" height="44" rx="8" fill="#FFFFFF" stroke="#D3D1C7" class="motion-do-demo"/><text x="160" y="57" font-family="Arial" font-size="10" fill="#5F5E5A" text-anchor="middle">Modal opening</text><text x="160" y="104" font-family="Arial" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle">200–250ms · ease-in-out</text></svg>
      <div class="dd-body"><strong>Functional &amp; brief.</strong> This modal uses the standard 200–250ms tier — nothing on the screen ever exceeds 350ms.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><circle cx="160" cy="46" r="16" fill="#534AB7" class="motion-dont-demo"/><text x="160" y="104" font-family="Arial" font-size="11" font-weight="700" fill="#A32D2D" text-anchor="middle">800ms · decorative bounce</text></svg>
      <div class="dd-body">Don’t add decorative bounce or parallax, exceed 350ms, or animate every background refresh.</div>
    </div>
  </div>


<h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Use exactly three transition speeds and nothing else: 100–150ms ease-out for hover/press/toggle micro-interactions, 200–250ms ease-in-out for dropdowns/modals/tooltips opening and closing, 300–350ms ease-in-out for page-level transitions like route changes or a sidebar collapsing. Never exceed 350ms for any transition. Do not animate initial page load — show a loading skeleton instead of a fade-in sequence. Do not animate chart or data re-renders caused by routine background refresh — update the values silently, in place, with no transition. Reserve the exact final height and width of any element in its loading skeleton so replacing the skeleton with real content causes no layout shift. Do not add decorative animation — no bouncing, staggering, or parallax effects anywhere.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does any transition take longer than 350ms?</li>
    <li>Does the screen animate on every auto-refresh, rather than updating silently?</li>
    <li>Does content shift position or size the moment a loading skeleton is replaced?</li>
    <li>Is there any purely decorative animation with no functional purpose?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 2 · Section 6 of 6 — Motion &amp; transitions</span></footer>
`,



"page-anatomy": `
  <div class="part-kicker">Part 3 — Layout &amp; Structure</div>
  <h1>Page anatomy</h1>
  <p>Every dashboard screen should feel like it belongs to the same product, even before anyone reads the content — because the skeleton around the content never changes. A fixed anatomy is what lets a user orient themselves on a screen they've never seen before.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Dashboard page anatomy: sidebar, topbar, and content area</title>
  <rect width="900" height="360" fill="#FFFFFF"/>
  <rect x="20" y="20" width="860" height="320" rx="10" fill="#F1EFE8"/>
  <rect x="20" y="20" width="180" height="320" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="110" y="50" font-family="Arial" font-size="12" font-weight="700" fill="#5F5E5A" text-anchor="middle">SIDEBAR</text>
  <rect x="40" y="70" width="140" height="14" rx="4" fill="#EDEBFA"/>
  <rect x="40" y="94" width="140" height="14" rx="4" fill="#F1EFE8"/>
  <rect x="40" y="118" width="140" height="14" rx="4" fill="#F1EFE8"/>
  <rect x="40" y="142" width="140" height="14" rx="4" fill="#F1EFE8"/>

  <rect x="210" y="20" width="670" height="60" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="230" y="55" font-family="Arial" font-size="12" font-weight="700" fill="#5F5E5A">TOPBAR — page title, search, user menu</text>

  <rect x="230" y="100" width="300" height="16" rx="4" fill="#2C2C2A"/>
  <rect x="700" y="100" width="150" height="26" rx="6" fill="#534AB7"/>
  <text x="775" y="118" font-family="Arial" font-size="11" fill="#FFFFFF" text-anchor="middle">Primary action</text>
  <text x="230" y="105" font-family="Arial" font-size="9" fill="#F1EFE8"> </text>

  <rect x="230" y="140" width="620" height="30" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="245" y="160" font-family="Arial" font-size="11" fill="#888780">Filters row</text>

  <rect x="230" y="185" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="440" y="185" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="650" y="185" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="450" y="330" font-family="Arial" font-size="12" fill="#5F5E5A">CONTENT AREA — page header + filters + cards</text>
  </svg>
  </div>

  <h2>The anatomy</h2>
  <table class="rule-table">
    <tr><th>Region</th><th>Contains</th></tr>
    <tr><td>Sidebar</td><td>Global/primary navigation only — never page-specific controls</td></tr>
    <tr><td>Topbar</td><td>Current page title, global search, notifications, user menu</td></tr>
    <tr><td>Page header</td><td>Page-specific title (if different from nav label) + the single primary action for this page</td></tr>
    <tr><td>Filters row</td><td>Controls that scope the data below — date range, segment, search</td></tr>
    <tr><td>Content area</td><td>Cards, tables, charts — the actual page content</td></tr>
  </table>
  <p><strong>Do:</strong> keep the same header pattern (title left, primary action right) on every page.<br><strong>Don't:</strong> put page-specific actions in the global sidebar — it should look identical from every page.</p>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="26" width="280" height="80" rx="6" fill="#F1EFE8"/><rect x="20" y="26" width="60" height="80" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="86" y="26" width="214" height="18" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="92" y="52" width="90" height="14" rx="3" fill="#2C2C2A"/><rect x="250" y="52" width="46" height="14" rx="3" fill="#534AB7"/><rect x="92" y="74" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="160" y="74" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#D3D1C7"/></svg>
      <div class="dd-body"><strong>Same skeleton everywhere.</strong> Sidebar for global nav; title left, primary action right.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="26" width="280" height="80" rx="6" fill="#F1EFE8"/><rect x="20" y="26" width="90" height="80" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="30" y="40" width="70" height="12" rx="3" fill="#EDEBFA"/><rect x="30" y="60" width="70" height="20" rx="4" fill="#534AB7"/><text x="65" y="98" font-family="Arial" font-size="8" fill="#A32D2D" text-anchor="middle">page action in nav</text></svg>
      <div class="dd-body">Don’t put page-specific actions or filters in the global sidebar — it must look identical everywhere.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Structure every dashboard page with the same anatomy: a persistent sidebar for global navigation only, a topbar with the page title and user controls, then a page header with the primary action button aligned right, a filters row scoping the data, and the content area below.
Never place page-specific actions or filters inside the sidebar — it must look identical across every page.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does the sidebar look identical to how it looks on every other page?</li>
    <li>Is there exactly one primary action, aligned consistently with other pages?</li>
    <li>Are filters visually separated from static page content?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 3 · Section 1 of 3 — Page anatomy</span></footer>
`,



"grid-responsive": `
  <div class="part-kicker">Part 3 — Layout &amp; Structure</div>
  <h1>Grid &amp; responsiveness</h1>
  <p>A dashboard rarely lives at one fixed width. Define what collapses, and in what order, before an AI agent has to improvise it screen by screen — otherwise every page breaks differently at the same width.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Three breakpoints and what collapses at each</title>
  <rect width="900" height="260" fill="#FFFFFF"/>
  <rect x="30" y="30" width="260" height="200" rx="8" fill="#F1EFE8"/>
  <rect x="45" y="45" width="40" height="170" rx="4" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="95" y="45" width="80" height="80" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="185" y="45" width="80" height="80" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="95" y="135" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="160" y="245" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle">Desktop — full sidebar, 2-col cards</text>

  <rect x="320" y="30" width="260" height="200" rx="8" fill="#F1EFE8"/>
  <rect x="335" y="45" width="24" height="170" rx="4" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="370" y="45" width="195" height="80" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="370" y="135" width="195" height="80" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="450" y="245" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle">Tablet — icon-only sidebar, 1-col cards</text>

  <rect x="610" y="30" width="260" height="200" rx="8" fill="#F1EFE8"/>
  <rect x="620" y="42" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="632" y="60" font-family="Arial" font-size="11" fill="#5F5E5A">☰  Menu</text>
  <rect x="620" y="78" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="620" y="158" width="240" height="60" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="740" y="245" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle">Mobile — hamburger nav, stacked cards</text>
  </svg>
  </div>

  <h2>Breakpoints</h2>
  <table class="rule-table">
    <tr><th>Breakpoint</th><th>Range</th><th>What changes</th></tr>
    <tr><td>Desktop</td><td>&gt; 1200px</td><td>Full sidebar with labels, multi-column card grids, tables show all columns</td></tr>
    <tr><td>Tablet</td><td>768–1200px</td><td>Sidebar collapses to icon-only, card grids drop to a single column</td></tr>
    <tr><td>Mobile</td><td>&lt; 768px</td><td>Sidebar becomes a hamburger menu, tables convert to stacked card lists</td></tr>
  </table>
  <p><strong>Collapse order:</strong> sidebar loses its labels first, then multi-column layouts stack, then dense tables convert to cards — never the reverse.</p>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="30" y="30" width="110" height="72" rx="8" fill="#F1EFE8"/><rect x="42" y="42" width="86" height="10" rx="2" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="42" y="58" width="86" height="10" rx="2" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="42" y="74" width="86" height="10" rx="2" fill="#FFFFFF" stroke="#D3D1C7"/><line x1="150" y1="66" x2="164" y2="66" stroke="#B4B2A9" stroke-width="2"/><path d="M164 61 l8 5 l-8 5 z" fill="#B4B2A9"/><rect x="184" y="34" width="56" height="64" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="250" y="34" width="56" height="64" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/></svg>
      <div class="dd-body"><strong>Collapse in order:</strong> sidebar labels → columns stack → tables become cards.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="120" y="30" width="80" height="74" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="130" y="42" width="180" height="10" rx="2" fill="#E4E2D8"/><rect x="130" y="60" width="180" height="10" rx="2" fill="#E4E2D8"/><rect x="130" y="78" width="180" height="10" rx="2" fill="#E4E2D8"/><text x="150" y="120" font-family="Arial" font-size="9" fill="#888780">rows overflow → sideways scroll</text></svg>
      <div class="dd-body">Don’t force a wide table into horizontal scroll on phones — stack it into cards instead.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Design responsively with three breakpoints: desktop (&gt;1200px) shows the full labeled sidebar and multi-column card grids; tablet (768–1200px) collapses the sidebar to icons only and drops card grids to a single column; mobile (&lt;768px) replaces the sidebar with a hamburger menu and converts any data table into a stacked card list instead of a horizontally-scrolling table.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does the sidebar degrade gracefully instead of disappearing abruptly?</li>
    <li>At mobile width, is any table still forcing horizontal scroll instead of stacking?</li>
    <li>Is the collapse order consistent with what's defined here on every page?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 3 · Section 2 of 3 — Grid &amp; responsiveness</span></footer>

"info-hierarchy": `
  <div class="part-kicker">Part 3 — Layout &amp; Structure</div>
  <h1>Information hierarchy</h1>
  <p>On a data screen, not everything can be the most important thing — and if everything is styled as if it is, nothing is. Hierarchy is deciding, deliberately, what a user's eye lands on first, second, and last.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Screen zones ranked by visual priority</title>
  <rect width="900" height="300" fill="#FFFFFF"/>
  <rect x="40" y="30" width="500" height="90" rx="8" fill="#FCEBEB"/>
  <circle cx="70" cy="65" r="14" fill="#A32D2D"/>
  <text x="70" y="70" font-family="Arial" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="95" y="70" font-family="Arial" font-size="13" font-weight="700" fill="#501313">Primary — the one thing needing action</text>
  <text x="95" y="95" font-family="Arial" font-size="11" fill="#A32D2D">Largest size, top-left, always visible without scrolling</text>

  <rect x="560" y="30" width="300" height="90" rx="8" fill="#F1EFE8"/>
  <circle cx="590" cy="65" r="14" fill="#5F5E5A"/>
  <text x="590" y="70" font-family="Arial" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="612" y="70" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A">Secondary — supporting context</text>
  <text x="612" y="95" font-family="Arial" font-size="11" fill="#5F5E5A">Smaller, adjacent to primary</text>

  <rect x="40" y="140" width="820" height="60" rx="8" fill="#FAFAF7" stroke="#D3D1C7"/>
  <circle cx="70" cy="170" r="14" fill="#B4B2A9"/>
  <text x="70" y="175" font-family="Arial" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="95" y="175" font-family="Arial" font-size="13" font-weight="700" fill="#5F5E5A">Tertiary — metadata (last updated, filters applied, IDs)</text>
  </svg>
  </div>

  <h2>The rule</h2>
  <ul>
    <li><strong>Primary</strong> — the single metric, alert, or decision this screen exists for. Largest size, strongest contrast, positioned top-left where scanning starts, always above the fold.</li>
    <li><strong>Secondary</strong> — context that supports the primary item: comparisons, trends, related numbers.</li>
    <li><strong>Tertiary</strong> — metadata: last-updated timestamps, applied filters, record counts. Smallest, quietest, often in the page header or footer.</li>
  </ul>
  <p>Hierarchy shifts by screen intent: a <strong>monitoring</strong> screen leads with the metric most likely to be abnormal; a <strong>reporting</strong> screen leads with the headline total; an <strong>exploration</strong> screen leads with the filter/control state itself.</p>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="30" width="150" height="72" rx="8" fill="#FCEBEB"/><text x="34" y="54" font-family="Arial" font-size="10" fill="#A32D2D">Primary</text><text x="34" y="88" font-family="Arial" font-size="26" font-weight="700" fill="#501313">92%</text><rect x="186" y="34" width="52" height="30" rx="6" fill="#F1EFE8"/><rect x="246" y="34" width="52" height="30" rx="6" fill="#F1EFE8"/><rect x="186" y="72" width="112" height="14" rx="4" fill="#FAFAF7" stroke="#D3D1C7"/></svg>
      <div class="dd-body"><strong>One thing leads.</strong> Largest, top-left, above the fold; metadata stays quiet.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="34" width="86" height="42" rx="8" fill="#FCEBEB"/><text x="63" y="62" font-family="Arial" font-size="16" font-weight="700" fill="#501313" text-anchor="middle">92%</text><rect x="116" y="34" width="86" height="42" rx="8" fill="#E6F1FB"/><text x="159" y="62" font-family="Arial" font-size="16" font-weight="700" fill="#042C53" text-anchor="middle">14k</text><rect x="212" y="34" width="86" height="42" rx="8" fill="#EAF3DE"/><text x="255" y="62" font-family="Arial" font-size="16" font-weight="700" fill="#173404" text-anchor="middle">$8m</text><text x="160" y="98" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">all equally loud</text></svg>
      <div class="dd-body">Don’t style everything as important — if all three shout, the eye has nowhere to land first.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Before generating this screen, identify the single most important metric, alert, or decision it exists to support, and give it the largest size, strongest contrast, and top-left position, visible without scrolling.
Treat comparisons and trends related to that item as secondary — smaller, adjacent, but still legible.
Treat metadata (timestamps, filters applied, record counts) as tertiary — smallest text, lowest-contrast color, positioned in the header or footer, never competing with the primary metric.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Is there one clear thing your eye lands on first — not three competing for attention?</li>
    <li>Is metadata visually quiet enough that it doesn't compete with real data?</li>
    <li>Does the hierarchy match this screen's actual purpose (monitor / report / explore)?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 3 · Section 3 of 3 — Information hierarchy</span></footer>
`,

  <div class="part-kicker">Part 4 — Components</div>
  <h1>Tables</h1>
  <p>Tables are where dashboards break down most often — a header that scrolls away, a column that overflows into the next one, or 500 rows dumped onto one page. These rules keep a table usable at any size.</p>

  <h2>The rules</h2>
  <table class="rule-table">
    <tr><th>Concern</th><th>Rule</th></tr>
    <tr><td>Pagination</td><td>Paginate at 25–50 rows. Use infinite scroll only for feed-like, non-tabular data — never for tables users need to compare row-to-row.</td></tr>
    <tr><td>Sorting</td><td>Show a clear arrow on the active sort column; default sort should match the most useful reading order (usually most recent or highest-priority first).</td></tr>
    <tr><td>Sticky header</td><td>Column headers stay visible on scroll for any table taller than one screen.</td></tr>
    <tr><td>Column overflow</td><td>Truncate long text with an ellipsis and reveal the full value on hover/tap — never let it push other columns off-screen.</td></tr>
  </table>

    <h2>Pagination</h2>
  <p>Long tables need a predictable way to move through rows. Paginate at 25&#8211;50 rows per page so the browser stays responsive and a user can cite an exact position (&quot;row 12, page 3&quot;). Reserve infinite scroll for feed-like, non-comparative data, and offer a &quot;Load more&quot; button when you want lazy loading without losing the footer or scroll position.</p>

  <div class="diagram-wrap">

  <rect x="40" y="34" width="820" height="60" rx="10" fill="#F1EFE8"/>

  <text x="200" y="69" font-family="Arial" font-size="12" fill="#5F5E5A">Showing 1&#8211;50 of 573</text>
  <text x="612" y="69" font-family="Arial" font-size="14" fill="#888780">&#8249;</text>
  <rect x="630" y="52" width="26" height="24" rx="6" fill="#534AB7"/><text x="643" y="69" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="676" y="69" font-family="Arial" font-size="12" fill="#5F5E5A" text-anchor="middle">2</text>
  <text x="706" y="69" font-family="Arial" font-size="12" fill="#5F5E5A" text-anchor="middle">3</text>
  <text x="736" y="69" font-family="Arial" font-size="12" fill="#888780" text-anchor="middle">&#8230;</text>
  <text x="770" y="69" font-family="Arial" font-size="12" fill="#5F5E5A" text-anchor="middle">12</text>
  <text x="808" y="69" font-family="Arial" font-size="14" fill="#534AB7">&#8250;</text>
  <text x="60" y="130" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A">Page size (remembered)</text>
  <text x="360" y="130" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A">Range + total, always shown</text>
  <text x="700" y="130" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A">Jump to any page</text>
  <text x="60" y="160" font-family="Arial" font-size="11" fill="#888780">25 / 50 / 100 rows</text>
  <text x="360" y="160" font-family="Arial" font-size="11" fill="#888780">so users can cite a position</text>
  <text x="700" y="160" font-family="Arial" font-size="11" fill="#888780">sort &amp; filters preserved</text>
  </svg>
  </div>
  <table class="rule-table">
    <tr><th>Pattern</th><th>Use when</th><th>Avoid when</th></tr>
    <tr><td>Numbered pagination</td><td>Users compare rows, jump to a known page, or cite a position; the total count matters</td><td>The data is an endless, time-ordered feed</td></tr>
    <tr><td>Load more</td><td>Progressive loading is fine but you still want a stable footer and scroll position</td><td>Users need to reach page N quickly</td></tr>

    <li>Offer a page-size control (25 / 50 / 100) and remember the choice across sessions.</li>

    <li>Keep the pager (and any bulk-action bar) visible as a sticky footer on long pages.</li>

  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="30" width="272" height="76" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="24" y="30" width="272" height="18" fill="#EDEBFA"/><text x="34" y="43" font-family="Arial" font-size="9" font-weight="700" fill="#534AB7">Name ▼</text><rect x="24" y="52" width="272" height="14" fill="#FAFAF7"/><rect x="24" y="82" width="272" height="14" fill="#FAFAF7"/><text x="160" y="120" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">‹ 1 2 3 … 12 › · 50/page</text></svg>

      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><text x="160" y="20" font-family="Arial" font-size="9" fill="#A32D2D" text-anchor="middle">no header · no paging</text><rect x="24" y="26" width="272" height="98" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="34" y="34" width="252" height="7" rx="2" fill="#E4E2D8"/><rect x="34" y="46" width="252" height="7" rx="2" fill="#E4E2D8"/><rect x="34" y="58" width="252" height="7" rx="2" fill="#E4E2D8"/><rect x="34" y="70" width="252" height="7" rx="2" fill="#E4E2D8"/><rect x="34" y="82" width="252" height="7" rx="2" fill="#E4E2D8"/><rect x="34" y="94" width="252" height="7" rx="2" fill="#E4E2D8"/><rect x="34" y="106" width="252" height="7" rx="2" fill="#E4E2D8"/></svg>
      <div class="dd-body">Don’t dump every row on one page or let the header scroll away.</div>
    </div>
  </div>


<h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Build tables with a sticky header that stays visible on scroll, and paginate at 25–50 rows per page rather than rendering everything at once or using infinite scroll.
Show a visible sort direction indicator on whichever column is currently sorted, and pick a sensible default sort instead of leaving the table unsorted.
Truncate any text that would overflow its column with an ellipsis, and show the full value in a tooltip on hover — never let long text push other columns out of alignment.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does the header stay visible when scrolling a long table?</li>
    <li>Is the current sort column and direction visible at a glance?</li>
    <li>Does any column overflow break the row layout instead of truncating cleanly?</li>
    <li>Is the table paginated at 25–50 rows, with the range, total, and active page all visible?</li>
  </ul>

  <h1>Charts &amp; data viz</h1>

  </g>
  <g>
    <rect x="460" y="20" width="200" height="180" rx="8" fill="#F1EFE8"/>
    <circle cx="560" cy="110" r="45" fill="none" stroke="#D3D1C7" stroke-width="16"/>
    <path d="M560 65 A45 45 0 0 1 601 130" fill="none" stroke="#185FA5" stroke-width="16"/>
    <text x="560" y="45" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle">Part-to-whole → Donut</text>
    <text x="560" y="195" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">≤5 slices max</text>
  </g>
  <g>
    <rect x="675" y="20" width="200" height="180" rx="8" fill="#F1EFE8"/>
    <rect x="700" y="150" width="18" height="20" fill="#185FA5"/>
    <rect x="722" y="120" width="18" height="50" fill="#185FA5"/>
    <rect x="744" y="90" width="18" height="80" fill="#185FA5"/>
    <rect x="766" y="110" width="18" height="60" fill="#185FA5"/>
    <rect x="788" y="140" width="18" height="30" fill="#185FA5"/>
    <text x="775" y="45" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle">Distribution → Histogram</text>
    <text x="775" y="195" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">Spread across a range</text>
  </g>
  </svg>
  </div>

  <h2>Chart-type-per-relationship</h2>
  <table class="rule-table">
    <tr><th>Data relationship</th><th>Use</th><th>Avoid</th></tr>
    <tr><td>Trend over time</td><td>Line chart</td><td>Bar chart for continuous time series</td></tr>
    <tr><td>Comparing categories</td><td>Bar chart</td><td>Pie/donut once there are more than 5 categories</td></tr>
    <tr><td>Part-to-whole</td><td>Donut with ≤5 slices, or a stacked bar</td><td>Pie charts with many thin slices</td></tr>
    <tr><td>Distribution</td><td>Histogram</td><td>Line chart, which implies a trend that isn't there</td></tr>
  </table>

  <h2>Labeling &amp; color</h2>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Direct labeling versus a legend, and colorblind-safe series colors</title>
  <rect width="900" height="200" fill="#FFFFFF"/>
  <rect x="30" y="20" width="410" height="160" rx="8" fill="#F1EFE8"/>
  <polyline points="60,140 110,110 160,120 210,80 260,95 310,60" fill="none" stroke="#185FA5" stroke-width="3"/>
  <text x="320" y="65" font-family="Arial" font-size="11" font-weight="700" fill="#185FA5">Signups</text>
  <polyline points="60,150 110,145 160,150 210,140 260,145 310,130" fill="none" stroke="#D9822B" stroke-width="3"/>
  <text x="320" y="135" font-family="Arial" font-size="11" font-weight="700" fill="#D9822B">Churn</text>
  <text x="235" y="35" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle">Direct labels — no legend needed</text>

  <rect x="460" y="20" width="410" height="160" rx="8" fill="#F1EFE8"/>
  <circle cx="500" cy="55" r="7" fill="#185FA5"/>
  <text x="515" y="60" font-family="Arial" font-size="12" fill="#2C2C2A">Signups</text>
  <circle cx="500" cy="80" r="7" fill="#D9822B"/>
  <text x="515" y="85" font-family="Arial" font-size="12" fill="#2C2C2A">Churn</text>
  <text x="665" y="35" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle">Blue/orange — colorblind-safe</text>
  <text x="665" y="160" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">Never rely on red vs. green alone</text>
  </svg>
  </div>
  <ul>
    <li>Direct-label series when there are 4 or fewer — skip the legend and put the label next to the line/bar itself.</li>
    <li>For colorblind-safe series, pair a blue/orange combination (or vary line style/pattern) instead of relying on red vs. green.</li>
    <li>Always label axes with units — "Revenue ($K)", not just "Revenue."</li>
  </ul>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><polyline class="a-draw" pathLength="1" points="24,96 70,74 116,84 162,54 208,66 260,40" fill="none" stroke="#185FA5" stroke-width="3"/><text x="150" y="118" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">trend → line</text></svg>
      <div class="dd-body"><strong>Type follows data:</strong> line for trends, bar for comparisons, donut (≤5) for parts.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><circle cx="120" cy="60" r="26" fill="none" stroke="#185FA5" stroke-width="18" stroke-dasharray="9 5"/><text x="120" y="112" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">many-slice pie for a trend</text></svg>
      <div class="dd-body">Don’t use a pie for a trend, or split a donut into a dozen unreadable slices.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Choose chart type based on the data relationship, not visual preference: line charts for trends over time, bar charts for comparing categories, a donut chart with no more than 5 slices for part-to-whole, and histograms for distributions.
When a chart has 4 or fewer series, label them directly next to their line/bar instead of using a separate legend.
Use a colorblind-safe palette for multi-series charts (e.g. blue/orange, not red/green) and always label axes with units.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does the chart type actually match the relationship in the data?</li>
    <li>Are axes labeled with units, not just bare numbers?</li>
    <li>Would this chart still make sense to someone who can't distinguish red from green?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 4 · Section 2 of 10 — Charts &amp; data viz</span></footer>
`,



"kpi-cards": `
  <div class="part-kicker">Part 4 — Components</div>
  <h1>KPI / stat cards</h1>
  <p>A stat card answers one question: is this number good, bad, or neutral, and compared to what? If a card can't answer "compared to what," it's just a number, not a KPI.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;display:block;">
  <title>Annotated KPI card anatomy</title>
  <rect width="900" height="260" fill="#FFFFFF"/>
  <rect x="60" y="30" width="290" height="200" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="84" y="60" font-family="Arial" font-size="12" fill="#5F5E5A">Monthly Active Users</text>
  <text x="84" y="104" font-family="Arial" font-size="34" font-weight="700" fill="#2C2C2A">12,204</text>
  <rect x="84" y="116" width="78" height="24" rx="12" fill="#EAF3DE" class="a-pulse"/>
  <text x="123" y="132" font-family="Arial" font-size="11" font-weight="700" fill="#173404" text-anchor="middle">&#9650; 8.2%</text>
  <text x="84" y="160" font-family="Arial" font-size="11" fill="#888780">vs. last month</text>
  <path d="M84 210 L110 202 L136 205 L162 192 L188 197 L214 183 L240 187 L266 174 L292 179 L326 168 L326 214 L84 214 Z" fill="#EAF3DE"/>
  <path class="a-draw" pathLength="1" d="M84 210 L110 202 L136 205 L162 192 L188 197 L214 183 L240 187 L266 174 L292 179 L326 168" fill="none" stroke="#3B6D11" stroke-width="2.5"/>
  <g font-family="Arial">
    <line x1="352" y1="56" x2="404" y2="56" stroke="#B4B2A9" stroke-width="1.5"/>
    <circle cx="418" cy="56" r="11" fill="#534AB7"/><text x="418" y="60" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="436" y="60" font-size="12.5" fill="#5F5E5A">Label &#8212; what this number is</text>
    <line x1="352" y1="96" x2="404" y2="96" stroke="#B4B2A9" stroke-width="1.5"/>
    <circle cx="418" cy="96" r="11" fill="#534AB7"/><text x="418" y="100" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="436" y="100" font-size="12.5" fill="#5F5E5A">Value &#8212; the largest element on the card</text>
    <line x1="352" y1="128" x2="404" y2="128" stroke="#B4B2A9" stroke-width="1.5"/>
    <circle cx="418" cy="128" r="11" fill="#534AB7"/><text x="418" y="132" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="436" y="132" font-size="12.5" fill="#5F5E5A">Delta chip &#8212; the only part with semantic color</text>
    <line x1="352" y1="158" x2="404" y2="158" stroke="#B4B2A9" stroke-width="1.5"/>
    <circle cx="418" cy="158" r="11" fill="#534AB7"/><text x="418" y="162" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="436" y="162" font-size="12.5" fill="#5F5E5A">Comparison period &#8212; always stated, never implied</text>
    <line x1="352" y1="190" x2="404" y2="190" stroke="#B4B2A9" stroke-width="1.5"/>
    <circle cx="418" cy="190" r="11" fill="#534AB7"/><text x="418" y="194" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="436" y="194" font-size="12.5" fill="#5F5E5A">Sparkline &#8212; optional trend shown as a light area</text>
  </g>
  </svg>
  </div>

  <h2>Required anatomy</h2>
  <ol>
    <li><strong>Label</strong> — plain-language name of the metric.</li>
    <li><strong>Value</strong> — the number itself, largest element on the card (see Typography: KPI number size).</li>
    <li><strong>Delta</strong> — direction and magnitude of change (arrow + %), the only part of the card that gets a semantic color.</li>
    <li><strong>Comparison period</strong> — always state what it's compared to ("vs. last month") — a delta with no stated baseline is meaningless.</li>
  </ol>
  <p><strong>Do:</strong> keep the card background neutral even when the delta is negative — only the delta chip takes red/green.<br><strong>Don't:</strong> color the entire card red for a bad number; that's a card-level alert doing a metric's job.</p>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="30" y="17" width="170" height="96" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/><text x="46" y="42" font-family="Arial" font-size="10" fill="#5F5E5A">Revenue</text><text x="46" y="72" font-family="Arial" font-size="22" font-weight="700" fill="#2C2C2A">$8,420</text><rect x="46" y="83" width="58" height="18" rx="9" fill="#FCEBEB"/><text x="75" y="96" font-family="Arial" font-size="10" font-weight="700" fill="#A32D2D" text-anchor="middle">▼ 4%</text></svg>
      <div class="dd-body"><strong>Neutral card, colored delta.</strong> Label, big value, delta chip, comparison period.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="75" y="17" width="170" height="96" rx="10" fill="#FCEBEB" stroke="#A32D2D"/><text x="91" y="46" font-family="Arial" font-size="10" fill="#A32D2D">Revenue</text><text x="91" y="80" font-family="Arial" font-size="22" font-weight="700" fill="#501313">$8,420</text></svg>
      <div class="dd-body">Don’t flood the whole card red for a bad number, or show a delta with no stated baseline.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Every KPI/stat card must include: a plain-language label, the metric value as the largest element on the card, a delta chip showing direction and magnitude of change, and explicit comparison-period text (e.g. "vs. last month") — never show a delta without stating what it's compared to.
Keep the card background and border neutral regardless of whether the metric is up or down. Apply semantic color (green/red) only to the small delta chip, never to the whole card.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does every KPI card state what its comparison baseline is?</li>
    <li>Is color used only on the delta, not the whole card?</li>
    <li>Is the value clearly the largest, most prominent element on the card?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 4 · Section 3 of 10 — KPI / stat cards</span></footer>

"filters": `
  <div class="part-kicker">Part 4 — Components</div>
  <h1>Filters &amp; date pickers</h1>
  <p>A filter that's applied but not visible is the single fastest way to make a dashboard feel wrong — the numbers are correct, but no one can tell why they don't match expectations.</p>
  <p>&quot;Filter&quot; is really a family of controls &#8212; search boxes, dropdowns, multi-selects, toggles, range sliders and date pickers &#8212; each suited to a different kind of choice. Whichever control sets a value, the applied state must surface the same way: as visible, removable chips above the data.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Filter bar with active filter chips</title>
  <rect width="900" height="180" fill="#FFFFFF"/>
  <rect x="40" y="30" width="820" height="60" rx="10" fill="#F1EFE8"/>
  <rect x="60" y="45" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="75" y="65" font-family="Arial" font-size="11" fill="#2C2C2A">📅 Last 30 days</text>
  <rect x="230" y="45" width="120" height="30" rx="16" fill="#EDEBFA"/>
  <text x="245" y="65" font-family="Arial" font-size="11" font-weight="700" fill="#534AB7">Region: EU  ×</text>
  <rect x="365" y="45" width="140" height="30" rx="16" fill="#EDEBFA"/>
  <text x="380" y="65" font-family="Arial" font-size="11" font-weight="700" fill="#534AB7">Status: Active  ×</text>
  <text x="530" y="65" font-family="Arial" font-size="11" fill="#888780" text-decoration="underline">Clear all</text>
  <text x="60" y="115" font-family="Arial" font-size="12" fill="#5F5E5A">↑ Filters sit directly above the data they affect — active filters shown as removable chips, never silently applied</text>
  </svg>
  </div>

    <h2>Types of filters</h2>
  <p>Match the control to the shape of the choice. Whatever the control, render each applied value as a removable chip so the active state is never hidden.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>The common filter control types</title>
  <rect width="900" height="260" fill="#FFFFFF"/>
  <rect x="30" y="24" width="270" height="70" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <circle cx="52" cy="59" r="7" fill="none" stroke="#888780" stroke-width="1.6"/><line x1="57" y1="64" x2="63" y2="70" stroke="#888780" stroke-width="1.6"/>
  <text x="74" y="63" font-family="Arial" font-size="12" fill="#888780">Search customers&#8230;</text>
  <text x="34" y="112" font-family="Arial" font-size="11" font-weight="700" fill="#2C2C2A">Search / text</text>

  <rect x="315" y="24" width="270" height="70" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="332" y="63" font-family="Arial" font-size="12" fill="#2C2C2A">Region: EU</text>
  <text x="566" y="63" font-family="Arial" font-size="12" fill="#888780" text-anchor="end">&#9662;</text>
  <text x="319" y="112" font-family="Arial" font-size="11" font-weight="700" fill="#2C2C2A">Single-select dropdown</text>

  <rect x="600" y="24" width="270" height="70" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="616" y="46" width="66" height="24" rx="12" fill="#EDEBFA"/><text x="649" y="62" font-family="Arial" font-size="11" fill="#534AB7" text-anchor="middle">EU &#215;</text>
  <rect x="690" y="46" width="66" height="24" rx="12" fill="#EDEBFA"/><text x="723" y="62" font-family="Arial" font-size="11" fill="#534AB7" text-anchor="middle">US &#215;</text>
  <text x="770" y="62" font-family="Arial" font-size="11" fill="#888780">+2</text>
  <text x="604" y="112" font-family="Arial" font-size="11" font-weight="700" fill="#2C2C2A">Multi-select</text>

  <rect x="30" y="150" width="270" height="46" rx="8" fill="#F1EFE8"/>
  <rect x="38" y="156" width="86" height="34" rx="6" fill="#FFFFFF" stroke="#534AB7"/><text x="81" y="178" font-family="Arial" font-size="11" font-weight="700" fill="#534AB7" text-anchor="middle">All</text>
  <text x="160" y="178" font-family="Arial" font-size="11" fill="#5F5E5A" text-anchor="middle">Active</text>
  <text x="250" y="178" font-family="Arial" font-size="11" fill="#5F5E5A" text-anchor="middle">Churned</text>
  <text x="34" y="214" font-family="Arial" font-size="11" font-weight="700" fill="#2C2C2A">Segmented / toggle</text>

  <rect x="315" y="150" width="270" height="46" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <line x1="335" y1="173" x2="565" y2="173" stroke="#D3D1C7" stroke-width="4"/>
  <line x1="380" y1="173" x2="520" y2="173" stroke="#534AB7" stroke-width="4"/>
  <circle cx="380" cy="173" r="8" fill="#534AB7"/><circle cx="520" cy="173" r="8" fill="#534AB7"/>
  <text x="319" y="214" font-family="Arial" font-size="11" font-weight="700" fill="#2C2C2A">Range slider &#8212; $0&#8211;$50k</text>

  <rect x="600" y="150" width="270" height="46" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="616" y="162" width="44" height="22" rx="11" fill="#3B6D11"/><circle cx="649" cy="173" r="9" fill="#FFFFFF"/>
  <text x="672" y="178" font-family="Arial" font-size="11" fill="#2C2C2A">Only overdue</text>
  <text x="604" y="214" font-family="Arial" font-size="11" font-weight="700" fill="#2C2C2A">Boolean switch</text>
  </svg>
  </div>
  <table class="rule-table">
    <tr><th>Control</th><th>Use for</th><th>Notes</th></tr>
    <tr><td>Search / text</td><td>Free-text matching across many rows</td><td>Wait briefly after typing stops before searching; include a clear (&#215;) button</td></tr>
    <tr><td>Single-select dropdown</td><td>One value from a known list (Region, Status)</td><td>Show the current value in the trigger, not just &quot;Filter&quot;</td></tr>
    <tr><td>Multi-select</td><td>Several values from one dimension</td><td>Summarize as &quot;EU, US +2&quot; and expose each as a chip</td></tr>
    <tr><td>Segmented / toggle</td><td>2&#8211;4 mutually exclusive options</td><td>Cheaper to scan than a dropdown when options are few</td></tr>
    <tr><td>Range slider / numeric</td><td>Bounded numeric ranges (price, score)</td><td>Echo the selected min&#8211;max as text</td></tr>
    <tr><td>Boolean switch</td><td>A single on/off condition</td><td>Label the on-state (&quot;Only overdue&quot;), not just the toggle</td></tr>
  </table>

  <h2>Date &amp; time pickers</h2>
  <p>Date is the filter almost every dashboard shares, and the one most often done badly. Offer named presets for the common ranges, a calendar for custom ranges, and be explicit about whether a range is relative or absolute.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>A date picker: presets plus a custom calendar range</title>
  <rect width="900" height="300" fill="#FFFFFF"/>
  <rect x="60" y="30" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="74" y="50" font-family="Arial" font-size="11" fill="#2C2C2A">&#128197; Last 30 days &#9662;</text>
  <rect x="60" y="70" width="520" height="200" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="60" y="70" width="170" height="200" rx="10" fill="#FAFAF7"/>
  <text x="80" y="98" font-family="Arial" font-size="11" fill="#5F5E5A">Today</text>
  <text x="80" y="122" font-family="Arial" font-size="11" fill="#5F5E5A">Last 7 days</text>
  <rect x="72" y="132" width="146" height="24" rx="6" fill="#EDEBFA"/>
  <text x="80" y="148" font-family="Arial" font-size="11" font-weight="700" fill="#534AB7">Last 30 days</text>
  <text x="80" y="172" font-family="Arial" font-size="11" fill="#5F5E5A">Last 90 days</text>

  <text x="80" y="248" font-family="Arial" font-size="11" fill="#185FA5">Custom range&#8230;</text>
  <text x="250" y="98" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A">August 2026</text>
  <g font-family="Arial" font-size="10" fill="#888780">
  <text x="262" y="120">S</text><text x="300" y="120">M</text><text x="338" y="120">T</text><text x="376" y="120">W</text><text x="414" y="120">T</text><text x="452" y="120">F</text><text x="490" y="120">S</text>
  </g>
  <g font-family="Arial" font-size="11" fill="#2C2C2A">
  <rect x="290" y="132" width="216" height="24" rx="6" fill="#EDEBFA"/>
  <circle cx="298" cy="144" r="11" fill="#534AB7"/><text x="298" y="148" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="336" y="148" text-anchor="middle">4</text><text x="374" y="148" text-anchor="middle">5</text><text x="412" y="148" text-anchor="middle">6</text><text x="450" y="148" text-anchor="middle">7</text>
  <circle cx="490" cy="144" r="11" fill="#534AB7"/><text x="490" y="148" fill="#FFFFFF" text-anchor="middle">8</text>
  <text x="260" y="180" text-anchor="middle">9</text><text x="298" y="180" text-anchor="middle">10</text><text x="336" y="180" text-anchor="middle">11</text><text x="374" y="180" text-anchor="middle">12</text><text x="412" y="180" text-anchor="middle">13</text><text x="450" y="180" text-anchor="middle">14</text><text x="490" y="180" text-anchor="middle">15</text>
  </g>
  <text x="250" y="216" font-family="Arial" font-size="10" fill="#888780">Selected range highlighted, endpoints filled</text>
  <text x="610" y="110" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A">Presets cover most uses</text>
  <text x="610" y="150" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A">Calendar for custom ranges</text>
  <text x="610" y="190" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A">Relative vs. absolute</text>
  <text x="610" y="210" font-family="Arial" font-size="11" fill="#888780">&quot;Last 30 days&quot; re-evaluates on load;</text>
  <text x="610" y="226" font-family="Arial" font-size="11" fill="#888780">&quot;Jul 1&#8211;31&quot; stays fixed.</text>
  <text x="610" y="256" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A">Offer a comparison range</text>
  </svg>
  </div>
  <ul>
    <li><strong>Presets first</strong> &#8212; Today, Last 7 / 30 / 90 days, This month, This quarter, Year to date. These resolve the majority of cases in one click.</li>
    <li><strong>Custom range</strong> &#8212; a two-click calendar (start, then end) for anything the presets don&#39;t cover, with the result echoed back as text.</li>
    <li><strong>Relative vs. absolute</strong> &#8212; &quot;Last 30 days&quot; is relative and should re-evaluate on every load; &quot;Jul 1 &#8211; Jul 31&quot; is absolute and fixed. Make clear which is active, because they behave differently on a shared or bookmarked link.</li>
    <li><strong>Comparison ranges</strong> &#8212; for trend screens, offer &quot;compare to previous period / same period last year&quot; so a delta has an explicit baseline (ties back to KPI cards).</li>
    <li><strong>Always resolve to text</strong> &#8212; show &quot;Last 30 days (Jul 4 &#8211; Aug 2)&quot;, never just a calendar icon, and never leave the default a mystery.</li>
  </ul>

<h2>The rules</h2>
  <ul>
    <li>Filters live <strong>directly above</strong> the content they scope — never in a separate settings page or hidden drawer.</li>
    <li>Every active filter renders as a visible, removable chip — a filter panel that's collapsed shouldn't hide the fact that filters are applied.</li>
    <li>Show the default date range as explicit text ("Last 30 days"), never just an icon.</li>
    <li>Provide a single "Clear all" action once more than one filter is active.</li>
  </ul>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="40" width="280" height="30" rx="8" fill="#F1EFE8"/><rect x="30" y="46" width="100" height="18" rx="9" fill="#EDEBFA"/><text x="80" y="59" font-family="Arial" font-size="9" fill="#534AB7" text-anchor="middle">Last 90 days ×</text><rect x="138" y="46" width="88" height="18" rx="9" fill="#EDEBFA"/><text x="182" y="59" font-family="Arial" font-size="9" fill="#534AB7" text-anchor="middle">Team: Sales ×</text><text x="258" y="59" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">Clear all</text></svg>
      <div class="dd-body"><strong>Chips above the data.</strong> Every active filter visible and removable; ranges as text.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="40" width="280" height="30" rx="8" fill="#F1EFE8"/><rect x="30" y="46" width="80" height="18" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><text x="70" y="59" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">Filters ▸</text><text x="210" y="59" font-family="Arial" font-size="9" fill="#A32D2D" text-anchor="middle">3 applied — but hidden</text></svg>
      <div class="dd-body">Don’t hide applied filters behind a collapsed panel, or show a date range as just an icon.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Place all filters directly above the data table or chart they affect, never on a separate page or behind a collapsed panel that hides active state.
Render every currently-active filter as a removable chip with an ✕, so it's always visible which filters are applied — even if the filter control itself is collapsed.
Show date ranges as explicit text (e.g. "Last 30 days"), and include a "Clear all" action once more than one filter is active.
Provide named date presets (Today, Last 7/30/90 days, This month, This quarter, Year to date) alongside a custom calendar range; make explicit whether a chosen range is relative or absolute, and always echo the resolved range back as text (e.g. "Last 30 days (Jul 4 – Aug 2)").</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Can you tell which filters are active without opening a menu?</li>
    <li>Is the date range stated in words, not just an icon?</li>
    <li>Is there a way to clear all filters in one action?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 4 · Section 4 of 10 — Filters &amp; date pickers</span></footer>

"forms": `
  <div class="part-kicker">Part 4 — Components</div>
  <h1>Forms &amp; inputs</h1>
  <p>Forms are where users commit changes — the cost of ambiguity here is highest. Consistent states (default, focus, error) let people trust that a form is behaving predictably before they submit.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Form field states: default, focus, and error</title>

  <g>
    <text x="60" y="40" font-family="Arial" font-size="12" fill="#5F5E5A">Team name</text>
    <rect x="60" y="50" width="230" height="36" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
    <text x="230" y="130" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Default</text>
  </g>
  <g>
    <text x="330" y="40" font-family="Arial" font-size="12" fill="#5F5E5A">Team name</text>
    <rect x="330" y="50" width="230" height="36" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="2"/>
    <text x="500" y="130" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Focus</text>
  </g>
  <g>
    <text x="600" y="40" font-family="Arial" font-size="12" fill="#5F5E5A">Email <tspan fill="#A32D2D">*</tspan></text>
    <rect x="600" y="50" width="230" height="36" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/>
    <text x="612" y="73" font-family="Arial" font-size="12" fill="#7A2020">not-an-email</text>
    <text x="600" y="103" font-family="Arial" font-size="11" fill="#A32D2D">⚠ Enter a valid email address</text>
    <text x="715" y="130" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Error</text>
  </g>
  </svg>
  </div>

  <h2>The rules</h2>
  <table class="rule-table">
    <tr><th>Concern</th><th>Rule</th></tr>
    <tr><td>Labels</td><td>Always above the input, never placeholder-only — placeholder text disappears the moment someone types.</td></tr>
    <tr><td>Required fields</td><td>Mark with an asterisk plus visible label text, not color alone.</td></tr>
    <tr><td>Validation timing</td><td>Validate on blur (after leaving the field), not on every keystroke.</td></tr>
    <tr><td>Error display</td><td>Red border + icon + specific message below the field — never just a red border with no explanation.</td></tr>
  </table>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><text x="24" y="30" font-family="Arial" font-size="9" fill="#888780">While typing</text><rect x="24" y="36" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><text x="34" y="53" font-family="Arial" font-size="10" fill="#2C2C2A">jane@exa|</text><text x="176" y="30" font-family="Arial" font-size="9" fill="#888780">On blur</text><rect x="176" y="36" width="120" height="26" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/><text x="186" y="53" font-family="Arial" font-size="10" fill="#7A2020">jane@exa</text><text x="24" y="88" font-family="Arial" font-size="9" fill="#3B6D11">no judgment while typing —</text><text x="24" y="102" font-family="Arial" font-size="9" fill="#3B6D11">checked only after leaving the field</text></svg>
      <div class="dd-body"><strong>Label above, validate on blur.</strong> Errors show a red border, an icon, and how to fix it.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="36" width="80" height="26" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/><text x="34" y="53" font-family="Arial" font-size="9" fill="#7A2020">j|</text><rect x="116" y="36" width="80" height="26" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/><text x="126" y="53" font-family="Arial" font-size="9" fill="#7A2020">ja|</text><rect x="208" y="36" width="88" height="26" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/><text x="218" y="53" font-family="Arial" font-size="9" fill="#7A2020">jan|</text><text x="160" y="88" font-family="Arial" font-size="9" fill="#A32D2D" text-anchor="middle">error flashes on every single</text><text x="160" y="102" font-family="Arial" font-size="9" fill="#A32D2D" text-anchor="middle">keystroke before the word is finished</text></svg>
      <div class="dd-body">Don’t use placeholder-as-label, validate on every keystroke, or show a red border with no message.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Place every input label above its field, never rely on placeholder text as the only label. Mark required fields with a visible asterisk and the word "required" in the label, not color alone.
Validate fields on blur rather than on every keystroke, and when a field is invalid, show a red border, a warning icon, and a specific error message below the field explaining what to fix — never just red styling with no explanation.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does every field have a persistent label, not just a placeholder?</li>
    <li>Can a required field be identified without color vision?</li>
    <li>Does every error message say what's wrong and how to fix it?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 4 · Section 5 of 10 — Forms &amp; inputs</span></footer>

"navigation": `
  <div class="part-kicker">Part 4 — Components</div>
  <h1>Navigation</h1>
  <p>Navigation is a promise: it should always tell the user where they are and where they can go, using the same pattern on every page.</p>
  <p>This page covers four distinct patterns, shown side by side below: <strong>primary sidebar</strong> navigation, <strong>secondary in-page tabs</strong>, <strong>breadcrumbs</strong> for orientation, and <strong>mobile</strong> navigation. Each has its own rule — they're not interchangeable.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Primary and secondary navigation with active state and breadcrumbs</title>

  <rect x="30" y="24" width="400" height="140" rx="10" fill="#F1EFE8"/>

  <text x="60" y="96" font-family="Arial" font-size="12" fill="#5F5E5A">Reports</text>
  <text x="60" y="121" font-family="Arial" font-size="12" fill="#5F5E5A">Team</text>
  <text x="60" y="146" font-family="Arial" font-size="12" fill="#5F5E5A">Settings</text>
  <text x="214" y="96" font-family="Arial" font-size="11" fill="#5F5E5A">Always visible.</text>

  <text x="486" y="44" font-family="Arial" font-size="10" font-weight="700" fill="#888780">SECONDARY &#183; TABS</text>

  <text x="532" y="79" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle">Overview</text>

  <text x="46" y="200" font-family="Arial" font-size="10" font-weight="700" fill="#888780">WAYFINDING &#183; BREADCRUMBS</text>

  <h2>The rules</h2>
  <ul>
    <li><strong>Primary nav</strong> (sidebar) — top-level product sections, always visible, same across every page.</li>
    <li><strong>Secondary nav</strong> (tabs) — sub-views within one section, shown only on pages that have them.</li>
    <li><strong>Active state</strong> — indicate with a background fill plus a left border accent, not color text alone.</li>
    <li><strong>Breadcrumbs</strong> — only appear once a user is 2+ levels deep; skip them on top-level pages, where they're just noise.</li>
    <li><strong>Mobile</strong> — the sidebar collapses behind a hamburger icon into a slide-out drawer; tabs and breadcrumbs keep their same rules, just at a narrower width.</li>
  </ul>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="16" y="12" width="130" height="24" rx="4" fill="#EDEBFA"/><rect x="16" y="12" width="4" height="24" fill="#534AB7"/><text x="28" y="28" font-family="Arial" font-size="11" font-weight="700" fill="#534AB7">Dashboard</text><text x="16" y="54" font-family="Arial" font-size="9" fill="#3B6D11">sidebar: fill + left accent = active</text><line x1="16" y1="68" x2="304" y2="68" stroke="#EFEEE9" stroke-width="1"/><text x="16" y="90" font-family="Arial" font-size="11" fill="#5F5E5A">Home <tspan fill="#B4B2A9">›</tspan> Reports <tspan fill="#B4B2A9">›</tspan> <tspan fill="#2C2C2A" font-weight="700">Revenue</tspan></text><text x="16" y="108" font-family="Arial" font-size="9" fill="#3B6D11">breadcrumb: shown only 2+ levels deep</text></svg>
      <div class="dd-body"><strong>Active = fill + left accent</strong>, not color alone. Two levels max; breadcrumbs only when deep.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><text x="16" y="28" font-family="Arial" font-size="11" font-weight="700" fill="#534AB7">Dashboard</text><text x="16" y="46" font-family="Arial" font-size="11" fill="#5F5E5A">Reports</text><text x="16" y="60" font-family="Arial" font-size="9" fill="#A32D2D">color alone — same bg as everything else</text><line x1="16" y1="68" x2="304" y2="68" stroke="#EFEEE9" stroke-width="1"/><text x="16" y="90" font-family="Arial" font-size="11" fill="#B4B2A9">Home</text><text x="16" y="108" font-family="Arial" font-size="9" fill="#A32D2D">a crumb with nowhere to lead — pure noise</text></svg>
      <div class="dd-body">Don’t signal the current page by text color alone, or nest more than two navigation levels.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Use a persistent sidebar for primary navigation across top-level sections, and in-page tabs for secondary navigation within a section — never nest more than these two levels in the same navigation pattern.
Indicate the active nav item with both a background fill and a left border accent, not text color alone.
Only show breadcrumbs when the user is two or more levels deep in the navigation hierarchy; omit them on top-level pages.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Is the active nav item identifiable without relying on color alone?</li>
    <li>Are breadcrumbs shown only where they add real orientation value?</li>
    <li>Is the primary nav visually identical across every page?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 4 · Section 6 of 10 — Navigation</span></footer>
