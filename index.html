<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard UX Guide</title>
<style>
  :root{
    --bg:#FAFAF7;
    --surface:#FFFFFF;
    --surface-alt:#F1EFE8;
    --border:#D3D1C7;
    --text-primary:#2C2C2A;
    --text-secondary:#5F5E5A;
    --text-tertiary:#888780;
    --brand:#534AB7;
    --brand-bg:#EDEBFA;
    --green:#3B6D11; --green-bg:#EAF3DE;
    --amber:#854F0B; --amber-bg:#FAEEDA;
    --red:#A32D2D; --red-bg:#FCEBEB;
    --blue:#185FA5; --blue-bg:#E6F1FB;
    --sidebar-w:290px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--text-primary);
    background:var(--bg);
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--surface);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:24px 0 60px;
  }
  .sidebar-header{
    padding:0 20px 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:12px;
  }
  .sidebar-header .eyebrow{
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-tertiary);
    font-weight:700;
  }
  .sidebar-header h1{
    font-size:17px;
    margin:4px 0 0;
    font-weight:700;
  }
  .part{
    margin:18px 0 4px;
  }
  .part-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--text-tertiary);
    padding:6px 20px;
  }
  ul.section-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .section-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 20px 8px 22px;
    font-size:13.5px;
    color:var(--text-secondary);
    cursor:pointer;
    border-left:3px solid transparent;
    line-height:1.35;
  }
  .section-item:hover{
    background:var(--surface-alt);
    color:var(--text-primary);
  }
  .section-item.active{
    background:var(--brand-bg);
    color:var(--brand);
    border-left-color:var(--brand);
    font-weight:700;
  }
  .section-item .num{
    color:var(--text-tertiary);
    font-variant-numeric:tabular-nums;
    font-size:12px;
    min-width:18px;
  }
  .section-item.active .num{color:var(--brand);}
  .badge-planned{
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--text-tertiary);
    background:var(--surface-alt);
    border:1px solid var(--border);
    border-radius:20px;
    padding:1px 7px;
    margin-left:auto;
    flex-shrink:0;
  }

  /* ---------- Content ---------- */
  .content-scroll{
    flex:1;
    overflow-y:auto;
  }
  .panel{
    display:none;
    max-width:980px;
    margin:0 auto;
    padding:56px 64px 120px;
  }
  .panel.active{display:block;}
  .panel .part-kicker{
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--brand);
    margin-bottom:8px;
  }
  .panel h1{
    font-size:32px;
    margin:0 0 22px;
    letter-spacing:-.01em;
  }
  .panel h2{
    font-size:19px;
    margin:40px 0 12px;
    padding-top:8px;
  }
  .panel p{
    font-size:15px;
    line-height:1.65;
    color:var(--text-secondary);
    margin:0 0 14px;
  }
  .panel p strong{color:var(--text-primary);}
  .panel ul,.panel ol{
    font-size:15px;
    line-height:1.65;
    color:var(--text-secondary);
    padding-left:22px;
    margin:0 0 14px;
  }
  .panel li{margin-bottom:6px;}
  .panel img.diagram, .panel .diagram-wrap{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    margin:18px 0 26px;
    background:#fff;
    display:block;
  }
  .callout{
    background:var(--surface-alt);
    border-radius:10px;
    padding:16px 20px;
    margin:18px 0;
    font-size:14px;
    color:var(--text-secondary);
    line-height:1.6;
  }
  .callout strong{color:var(--text-primary);}
  table.rule-table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
    margin:14px 0 26px;
  }
  table.rule-table th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--text-tertiary);
    border-bottom:1px solid var(--border);
    padding:8px 10px;
  }
  table.rule-table td{
    border-bottom:1px solid var(--border);
    padding:10px;
    color:var(--text-secondary);
    vertical-align:top;
  }
  table.rule-table td strong{color:var(--text-primary);}
  blockquote.prompt{
    background:#20203A;
    color:#EAE9F5;
    border-radius:10px;
    padding:20px 22px;
    font-size:13.5px;
    line-height:1.7;
    margin:14px 0 26px;
    white-space:pre-wrap;
  }
  blockquote.prompt b{color:#B9B0F7;}
  .checklist{
    list-style:none;
    padding:0;
    margin:0 0 20px;
  }
  .checklist li{
    display:flex;
    gap:10px;
    font-size:14.5px;
    color:var(--text-secondary);
    margin-bottom:9px;
    align-items:flex-start;
  }
  .checklist li::before{
    content:"";
    flex:0 0 16px;
    width:16px;height:16px;
    margin-top:2px;
    border:1.5px solid var(--border);
    border-radius:4px;
  }

  /* Planned placeholder */
  .planned-wrap{
    border:1.5px dashed var(--border);
    border-radius:12px;
    padding:36px 32px;
    text-align:left;
    background:var(--surface-alt);
  }
  .planned-wrap .tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text-tertiary);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:3px 10px;
    margin-bottom:14px;
  }
  .planned-wrap h3{
    margin:0 0 10px;
    font-size:16px;
  }
  .planned-wrap ul{
    margin:0;
    padding-left:20px;
    color:var(--text-secondary);
    font-size:14px;
    line-height:1.7;
  }

  footer.panel-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:50px;
    padding-top:20px;
    border-top:1px solid var(--border);
    font-size:12.5px;
    color:var(--text-tertiary);
  }

  /* ===== Do's & Don'ts blocks ===== */
  .dodont{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin:14px 0 26px;
  }
  @media (max-width:760px){ .dodont{grid-template-columns:1fr;} }
  .dd-card{
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--surface);
    display:flex;
    flex-direction:column;
  }
  .dd-card.do{ border-color:#BEDA98; }
  .dd-card.dont{ border-color:#E7B4B4; }
  .dd-head{
    display:flex; align-items:center; gap:8px;
    padding:9px 14px;
    font-size:13px; font-weight:700; letter-spacing:.01em;
  }
  .dd-card.do .dd-head{ background:var(--green-bg); color:var(--green); }
  .dd-card.dont .dd-head{ background:var(--red-bg); color:var(--red); }
  .dd-art{ width:100%; display:block; background:#fff; border-top:1px solid var(--border); }
  .dd-body{ padding:11px 14px; font-size:13.5px; line-height:1.55; color:var(--text-secondary); }
  .dd-body strong{ color:var(--text-primary); }

  /* ===== Motion system =====
     Entrance/loop animations are scoped to .panel.active so they only run on the
     visible panel and re-run each time a panel is opened. All resolve to a valid
     resting state and are fully disabled under prefers-reduced-motion. */
  @keyframes aRise  { from{opacity:0; transform:translateY(7px);} to{opacity:1; transform:translateY(0);} }
  @keyframes aDraw  { from{stroke-dashoffset:1;} to{stroke-dashoffset:0;} }
  @keyframes aGrow  { from{transform:scaleY(0);} to{transform:scaleY(1);} }
  @keyframes aPulse { 0%,100%{opacity:1;} 50%{opacity:.28;} }
  @keyframes aPop   { from{opacity:0; transform:scale(.82);} to{opacity:1; transform:scale(1);} }
  @keyframes aInR   { from{opacity:0; transform:translateX(48px);} to{opacity:1; transform:translateX(0);} }
  @keyframes aInL   { from{opacity:0; transform:translateX(-32px);} to{opacity:1; transform:translateX(0);} }
  @keyframes aInDown{ from{opacity:0; transform:translateY(-16px);} to{opacity:1; transform:translateY(0);} }
  @keyframes aBob   { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
  @keyframes aSpin  { to{transform:rotate(360deg);} }
  @keyframes aMoveX { 0%{transform:translateX(0);} 65%,100%{transform:translateX(var(--mx,110px));} }
  @keyframes aExpand{ from{transform:scaleY(0); opacity:.35;} to{transform:scaleY(1); opacity:1;} }
  @keyframes aTimer { from{transform:scaleX(1);} to{transform:scaleX(0);} }

  /* gentle entrance for every main diagram and every do/don't illustration */
  .panel.active .diagram-wrap > svg,
  .panel.active .dd-art{ animation:aRise 350ms ease-out both; }

  /* opt-in element animations */
  .a-draw{ stroke-dasharray:1; }
  .panel.active .a-draw{ animation:aDraw 950ms ease-out both; }
  .a-grow{ transform-box:fill-box; transform-origin:50% 100%; }
  .panel.active .a-grow{ animation:aGrow 620ms cubic-bezier(.2,.7,.3,1) both; }
  .a-pop{ transform-box:fill-box; transform-origin:50% 50%; }
  .panel.active .a-pop{ animation:aPop 280ms ease-out both; }
  .a-inr{ transform-box:fill-box; }
  .panel.active .a-inr{ animation:aInR 340ms ease-out both; }
  .a-inl{ transform-box:fill-box; }
  .panel.active .a-inl{ animation:aInL 320ms ease-out both; }
  .a-indown{ transform-box:fill-box; }
  .panel.active .a-indown{ animation:aInDown 320ms ease-out both; }
  .a-expand{ transform-box:fill-box; transform-origin:50% 0; }
  .panel.active .a-expand{ animation:aExpand 320ms ease-out both; }
  .panel.active .a-pulse{ animation:aPulse 1.8s ease-in-out infinite; }
  .a-bob{ transform-box:fill-box; transform-origin:50% 50%; }
  .panel.active .a-bob{ animation:aBob 2.2s ease-in-out infinite; }
  .a-spin{ transform-box:fill-box; transform-origin:50% 50%; }
  .panel.active .a-spin{ animation:aSpin 1s linear infinite; }
  .a-movex{ transform-box:fill-box; }
  .panel.active .a-movex{ animation:aMoveX 2.6s ease-in-out infinite; }
  .a-timer{ transform-box:fill-box; transform-origin:0 50%; }
  .panel.active .a-timer{ animation:aTimer 4.6s linear infinite; }

  @media (prefers-reduced-motion: reduce){
    .panel.active .diagram-wrap > svg,
    .panel.active .dd-art,
    .panel.active .a-draw, .panel.active .a-grow, .panel.active .a-pop,
    .panel.active .a-inr, .panel.active .a-inl, .panel.active .a-indown,
    .panel.active .a-expand, .panel.active .a-pulse, .panel.active .a-bob,
    .panel.active .a-spin, .panel.active .a-movex, .panel.active .a-timer,
    .panel.active .motion-do-demo, .panel.active .motion-dont-demo{
      animation:none !important;
    }
  }

  @keyframes aTrack{ from{transform:translateX(0);} to{transform:translateX(150px);} }
  .m-demo{ transform-box:fill-box; }

  @keyframes doorEase{
    0%   { opacity:0; transform:scale(.85); }
    9%   { opacity:1; transform:scale(1); }
    55%  { opacity:1; transform:scale(1); }
    64%  { opacity:0; transform:scale(.92); }
    100% { opacity:0; transform:scale(.92); }
  }
  @keyframes badBounce{
    0%   { opacity:0; transform:scale(.4); }
    18%  { opacity:1; transform:scale(1.35); }
    30%  { transform:scale(.82); }
    42%  { transform:scale(1.15); }
    54%  { transform:scale(.94); }
    66%  { opacity:1; transform:scale(1); }
    80%  { opacity:1; transform:scale(1); }
    90%  { opacity:0; transform:scale(1); }
    100% { opacity:0; transform:scale(1); }
  }
  .motion-do-demo{ transform-box:fill-box; transform-origin:50% 50%; }
  .panel.active .motion-do-demo{ animation:doorEase 2.6s ease-in-out infinite; }
  .motion-dont-demo{ transform-box:fill-box; transform-origin:50% 50%; }
  .panel.active .motion-dont-demo{ animation:badBounce 2.6s ease-in-out infinite; }
  .panel.active .m-demo{ animation:aTrack 1.2s ease-in-out infinite alternate; }
  .panel.active .m-fast{ animation-duration:.55s; }
  .panel.active .m-mid{ animation-duration:1.15s; }
  .panel.active .m-slow{ animation-duration:2.3s; }
  .panel.active .p-clockhand{ transform-box:view-box; transform-origin:130px 70px; animation:aSpin 3s linear infinite; }
  @media (prefers-reduced-motion: reduce){
    .panel.active .m-demo, .panel.active .p-clockhand{ animation:none !important; }
  }
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="eyebrow">Design System</div>
    <h1>Dashboard UX Guide</h1>
  </div>
  <!-- Sidebar contents injected by JS from sectionData -->
</nav>

<div class="content-scroll">
  <div id="panels"></div>
</div>

<script>
/* =========================================================
   SECTION DATA
   status: "ready" -> full content rendered
   status: "ready" -> placeholder card with outline bullets
   ========================================================= */
const guide = [
  {
    part: "Part 0", partTitle: "How to use this guide",
    sections: [
      { id: "how-to-use", title: "How to use this guide", status: "ready" }
    ]
  },
  {
    part: "Part 1", partTitle: "Working with AI agents",
    sections: [
      { id: "pre-prompt", title: "Pre-prompt checklist", status: "ready",
        outline: ["What to decide before writing the prompt: primary metric, audience, update frequency", "Which guide sections apply to this specific screen"] },
      { id: "style-presets", title: "Style presets (pick one, no design vocabulary needed)", status: "ready",
        outline: ["Three named visual presets, chosen by looking at a picture — not by knowing design terms", "The only two decisions anyone makes: which preset, and the brand color", "Ready-to-paste value blocks underneath each preset"] },
      { id: "prompt-scaffold", title: "Ready-made prompt scaffolding", status: "ready",
        outline: ["A single paste-in block that bakes in Parts 2–6", "How to layer a screen-specific ask on top of it"] },
      { id: "post-gen-qa", title: "Post-generation QA checklist", status: "ready",
        outline: ["A non-designer-friendly pass/fail list", "How to describe a fix to the agent without design vocabulary"] }
    ]
  },
  {
    part: "Part 2", partTitle: "Foundations",
    sections: [
      { id: "color", title: "Color", status: "ready" },
      { id: "typography", title: "Typography", status: "ready",
        outline: ["Type scale — how many sizes, and the ratio between them", "Weight — when to use regular vs. medium vs. bold", "Which size/weight pair to use for: page titles, section headers, body copy, captions, KPI numbers"] },
      { id: "spacing-grid", title: "Spacing & Grid", status: "ready",
        outline: ["Base spacing unit (e.g. 4px or 8px) and the allowed scale", "How spacing communicates grouping — related items closer, unrelated items farther", "Grid columns and gutters for dashboard layouts"] },
      { id: "elevation", title: "Elevation / Shadow", status: "ready",
        outline: ["What elevation communicates: this is temporary, or above the page", "Shadow scale — how many levels, and what each is for", "When to use elevation: modals, dropdowns, popovers, dragged cards", "When not to: static cards, page sections"] },
      { id: "iconography", title: "Iconography", status: "ready",
        outline: ["One icon set/source — never mix styles", "Sizing scale and consistent stroke width", "Icon + label pairing rule (never icon alone for meaning)"] },
      { id: "motion", title: "Motion & transitions", status: "ready",
        outline: ["Duration and easing scale — how fast things move and how", "What should animate vs. what should snap instantly", "Loading-to-loaded transitions that don't cause layout jumps"] }
    ]
  },
  {
    part: "Part 3", partTitle: "Layout & Structure",
    sections: [
      { id: "page-anatomy", title: "Page anatomy", status: "ready",
        outline: ["Sidebar, topbar, and content-area conventions", "What lives in global nav vs. page-level nav", "Consistent page header pattern (title, actions, filters)"] },
      { id: "grid-responsive", title: "Grid & responsiveness", status: "ready",
        outline: ["Breakpoints for the dashboard's supported screen sizes", "What collapses first: sidebar → nested tabs → cards stack", "Minimum viable width before a screen should scroll instead of compress"] },
      { id: "info-hierarchy", title: "Information hierarchy", status: "ready",
        outline: ["What earns primary visual weight on a data screen (the one KPI/alert that matters)", "Ordering rule: most actionable → most contextual", "How hierarchy changes for monitoring vs. reporting vs. exploration screens"] }
    ]
  },
  {
    part: "Part 4", partTitle: "Components",
    sections: [
      { id: "tables", title: "Tables", status: "ready",
        outline: ["Pagination vs. infinite scroll — when to use which", "Sort controls and default sort", "Sticky headers for long tables", "Column overflow and truncation rules"] },
      { id: "charts", title: "Charts & data viz", status: "ready",
        outline: ["Chart-type-per-data-relationship (trend → line, comparison → bar, part-to-whole → limited use of pie)", "Labeling rules — axis labels, direct labeling vs. legends", "Colorblind-safe palette rules for series data"] },
      { id: "kpi-cards", title: "KPI / stat cards", status: "ready",
        outline: ["Required anatomy: label, value, trend/comparison", "How to show change (delta, %, sparkline) consistently", "When a KPI needs a semantic color vs. staying neutral"] },
      { id: "filters", title: "Filters & date pickers", status: "ready",
        outline: ["Where filters live relative to the data they affect", "Default date ranges and how ranges are communicated", "Showing active filter state clearly"] },
      { id: "forms", title: "Forms & inputs", status: "ready",
        outline: ["Label placement and required-field convention", "Validation timing and error message pattern", "Input sizing consistency across the product"] },
      { id: "navigation", title: "Navigation", status: "ready",
        outline: ["Primary vs. secondary nav patterns", "Active/current-page indication", "Breadcrumbs — when they're needed vs. redundant"] },
      { id: "buttons", title: "Buttons & actions", status: "ready",
        outline: ["Primary vs. secondary vs. tertiary hierarchy — one primary action per view", "Disabled and loading states", "Confirming destructive actions before they run"] },
      { id: "modals", title: "Modals & dialogs", status: "ready",
        outline: ["Modal vs. drawer vs. inline expansion — when each is right", "Sizing and dismiss behavior (click-outside, Esc, unsaved changes)", "What never belongs in a modal"] },
      { id: "notifications", title: "Notifications & toasts", status: "ready",
        outline: ["Toast (transient) vs. banner (persistent) — when each applies", "Placement and stacking when more than one fires", "Auto-dismiss timing by severity"] },
      { id: "data-export", title: "Data export & reporting", status: "ready",
        outline: ["Where export controls live relative to the data", "Format choice — CSV vs. PDF vs. print view", "Handling exports too large to generate instantly"] }
    ]
  },
  {
    part: "Part 5", partTitle: "States",
    sections: [
      { id: "states", title: "Empty, loading, error & more", status: "ready",
        outline: ["Empty state — first-use vs. filtered-to-nothing", "Loading — skeletons vs. spinners, and when each applies", "Error state — what happened + how to recover", "Partial data — showing what loaded when some data failed", "Real-time update — indicating freshness without being distracting", "Permission-denied — distinct from 'not found'"] }
    ]
  },
  {
    part: "Part 6", partTitle: "Accessibility & Content",
    sections: [
      { id: "a11y-content", title: "Accessibility & content design", status: "ready",
        outline: ["Contrast minimums (recap + where they apply beyond text)", "Number and date formatting consistency (locale, precision, units)", "Plain-language copy rules for labels, errors, and empty states"] }
    ]
  }
];

/* =========================================================
   RENDER: sidebar
   ========================================================= */
const sidebar = document.getElementById('sidebar');
let globalIndex = 0;
guide.forEach(group => {
  const partDiv = document.createElement('div');
  partDiv.className = 'part';
  partDiv.innerHTML = `<div class="part-label">${group.part} — ${group.partTitle}</div>`;
  const ul = document.createElement('ul');
  ul.className = 'section-list';
  group.sections.forEach(sec => {
    globalIndex++;
    const li = document.createElement('li');
    li.className = 'section-item';
    li.dataset.target = sec.id;
    li.innerHTML = `<span class="num">${String(globalIndex).padStart(2,'0')}</span><span>${sec.title}</span>${sec.status==='planned' ? '<span class="badge-planned">Planned</span>' : ''}`;
    li.addEventListener('click', () => showPanel(sec.id));
    ul.appendChild(li);
  });
  partDiv.appendChild(ul);
  sidebar.appendChild(partDiv);
});

function showPanel(id){
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.section-item').forEach(i => i.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  document.querySelector(`.section-item[data-target="${id}"]`).classList.add('active');
  document.querySelector('.content-scroll').scrollTop = 0;
}

/* =========================================================
   RENDER: panels
   ========================================================= */
const panels = document.getElementById('panels');

function partKickerFor(id){
  for(const g of guide){ if(g.sections.some(s=>s.id===id)) return g.part + ' — ' + g.partTitle; }
  return '';
}

function renderPanels(){
  guide.forEach(group => {
    group.sections.forEach(sec => {
      const div = document.createElement('div');
      div.className = 'panel';
      div.id = 'panel-' + sec.id;
      if(sec.status === 'ready'){
        div.innerHTML = readyContent[sec.id];
      } else {
        div.innerHTML = `
          <div class="part-kicker">${partKickerFor(sec.id)}</div>
          <h1>${sec.title}</h1>
          <div class="planned-wrap">
            <span class="tag">Not written yet</span>
            <h3>What this section will cover</h3>
            <ul>${sec.outline.map(o=>`<li>${o}</li>`).join('')}</ul>
          </div>
          <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Section staged — content coming next</span></footer>
        `;
      }
      panels.appendChild(div);
    });
  });

  showPanel('how-to-use');
}
</script>

<!-- ready-made content, defined here, then renderPanels() is called once it's ready -->
<script>
var readyContent = {

"how-to-use": `
  <div class="part-kicker">Part 0</div>
  <h1>How to use this guide</h1>
  <p>This guide is a reference for anyone directing an AI coding agent to build or edit a dashboard — designer or not. It exists to keep every screen consistent, whether it was built in one sitting or across fifty separate prompts by different people.</p>

  <h2>Who it's for</h2>
  <p>Anyone prompting an AI agent to build dashboard screens. You don't need a design background — you need to recognize when a screen breaks a rule, and paste the matching prompt block so the agent fixes it.</p>

  <div class="part-kicker">Part 2 — Foundations</div>
  <h1>Color</h1>
  <p>Color is how a person tells "this number is fine" from "this number needs attention" — often in under a second, without reading text. If color is used inconsistently, users stop trusting it and start reading every number manually, which defeats the point of a dashboard.</p>

  <div class="callout"><strong>Rule:</strong> every color belongs to one of three groups — neutral, semantic, or brand. Mixing their jobs is the most common mistake in AI-generated dashboards.</div>

  <h2>1. Neutral — structure and text</h2>
  <p>Neutrals are your blacks, whites, and grays. They build the page itself: backgrounds, borders, body text, dividers, disabled states. They should make up <strong>80–90%</strong> of every screen.</p>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;display:block;">
  <title>The neutral scale: page background through primary text</title>
  <rect width="900" height="160" fill="#FFFFFF"/>
  <rect x="40" y="30" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.5"/>
  <rect x="200" y="30" width="150" height="60" rx="8" fill="#F1EFE8"/>
  <rect x="360" y="30" width="150" height="60" rx="8" fill="#D3D1C7"/>
  <rect x="520" y="30" width="150" height="60" rx="8" fill="#888780"/>
  <rect x="680" y="30" width="150" height="60" rx="8" fill="#2C2C2A"/>
  <text x="115" y="110" font-family="Arial" font-size="13" fill="#5F5E5A" text-anchor="middle">Page bg</text>
  <text x="275" y="110" font-family="Arial" font-size="13" fill="#5F5E5A" text-anchor="middle">Surface</text>
  <text x="435" y="110" font-family="Arial" font-size="13" fill="#5F5E5A" text-anchor="middle">Border</text>
  <text x="595" y="110" font-family="Arial" font-size="13" fill="#5F5E5A" text-anchor="middle">Secondary text</text>
  <text x="755" y="110" font-family="Arial" font-size="13" fill="#5F5E5A" text-anchor="middle">Primary text</text>
  <text x="450" y="140" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Five neutrals do 80–90% of the work on every screen</text>
  </svg>
  </div>
  <p><strong>Do:</strong> use a light neutral for the page background and a slightly different neutral for cards, so cards visibly sit on top of the page.<br><strong>Don't:</strong> use pure black (#000000) for text — a dark gray gives softer, more polished contrast.</p>

  <h2>2. Semantic — status and meaning</h2>
  <p>Semantic colors carry a fixed meaning that never changes across the product — the most important group for a dashboard, because it's what lets someone scan 40 numbers and instantly spot the 2 that matter.</p>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;display:block;">
  <title>The four semantic colors: success, warning, error, info</title>
  <rect width="900" height="110" fill="#FFFFFF"/>
  <rect x="40" y="15" width="195" height="70" rx="8" fill="#EAF3DE"/>
  <circle cx="65" cy="40" r="8" fill="#3B6D11"/>
  <text x="82" y="45" font-family="Arial" font-size="14" font-weight="700" fill="#173404">Success</text>
  <text x="60" y="67" font-family="Arial" font-size="12" fill="#3B6D11">On target / completed</text>
  <rect x="250" y="15" width="195" height="70" rx="8" fill="#FAEEDA"/>
  <circle cx="275" cy="40" r="8" fill="#854F0B"/>
  <text x="292" y="45" font-family="Arial" font-size="14" font-weight="700" fill="#412402">Warning</text>
  <text x="270" y="67" font-family="Arial" font-size="12" fill="#854F0B">Needs attention</text>
  <rect x="460" y="15" width="195" height="70" rx="8" fill="#FCEBEB"/>
  <circle cx="485" cy="40" r="8" fill="#A32D2D"/>
  <text x="502" y="45" font-family="Arial" font-size="14" font-weight="700" fill="#501313">Error</text>
  <text x="480" y="67" font-family="Arial" font-size="12" fill="#A32D2D">Critical / off target</text>
  <rect x="670" y="15" width="195" height="70" rx="8" fill="#E6F1FB"/>
  <circle cx="695" cy="40" r="8" fill="#185FA5"/>
  <text x="712" y="45" font-family="Arial" font-size="14" font-weight="700" fill="#042C53">Info</text>
  <text x="690" y="67" font-family="Arial" font-size="12" fill="#185FA5">Selected / neutral note</text>
  </svg>
  </div>
  <table class="rule-table">
    <tr><th>Color</th><th>Meaning</th><th>Used for</th></tr>
    <tr><td>Green</td><td>Success / good / on-target</td><td>Positive trend arrows, "completed" status, healthy values</td></tr>
    <tr><td>Amber</td><td>Warning / needs attention</td><td>Approaching a limit, "pending" status, wrong-direction trends</td></tr>
    <tr><td>Red</td><td>Error / critical / off-target</td><td>Failures, out-of-range values, negative trend arrows</td></tr>
    <tr><td>Blue</td><td>Informational / neutral highlight</td><td>Info banners, active/selected states, links</td></tr>
  </table>
  <p><strong>Do:</strong> pair color with an icon or label — never color alone.<br><strong>Don't:</strong> invent a 5th or 6th semantic color for a "special" status; use a label instead.</p>

  <h2>3. Brand — identity, used sparingly</h2>
  <p>Use brand color for one or two high-value, recurring elements — typically the primary action button, active nav item, and logo/header accent. Never fill large surfaces (a card, a whole sidebar) with it — it fights with semantic colors for attention.</p>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;display:block;">
  <title>Brand color used only on the primary action, never on large surfaces</title>
  <rect width="900" height="130" fill="#FFFFFF"/>
  <rect x="40" y="15" width="820" height="90" rx="8" fill="#F1EFE8"/>
  <rect x="60" y="45" width="150" height="32" rx="6" fill="#534AB7"/>
  <text x="135" y="66" font-family="Arial" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Export report</text>
  <rect x="230" y="45" width="140" height="32" rx="6" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text x="300" y="66" font-family="Arial" font-size="13" fill="#5F5E5A" text-anchor="middle">Cancel</text>
  <text x="400" y="66" font-family="Arial" font-size="13" fill="#888780">Only the primary action uses brand color — everything else stays neutral</text>
  </svg>
  </div>

  <h2>Correct vs. incorrect status usage</h2>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;display:block;">
  <title>Correct versus incorrect status color usage</title>
  <rect width="900" height="260" fill="#FFFFFF"/>
  <rect x="40" y="30" width="380" height="200" rx="12" fill="#F1EFE8"/>
  <text x="230" y="65" font-family="Arial" font-size="16" font-weight="700" fill="#3B6D11" text-anchor="middle">Correct</text>
  <rect x="90" y="90" width="280" height="50" rx="8" fill="#FFFFFF"/>
  <rect x="90" y="90" width="4" height="50" rx="2" fill="#3B6D11"/>
  <circle cx="120" cy="115" r="9" fill="#3B6D11"/>
  <text x="140" y="120" font-family="Arial" font-size="14" font-weight="700" fill="#173404">On target</text>
  <rect x="90" y="155" width="280" height="50" rx="8" fill="#FFFFFF"/>
  <rect x="90" y="155" width="4" height="50" rx="2" fill="#A32D2D"/>
  <circle cx="120" cy="180" r="9" fill="#A32D2D"/>
  <text x="140" y="185" font-family="Arial" font-size="14" font-weight="700" fill="#501313">Failed export</text>
  <rect x="480" y="30" width="380" height="200" rx="12" fill="#F1EFE8"/>
  <text x="670" y="65" font-family="Arial" font-size="16" font-weight="700" fill="#A32D2D" text-anchor="middle">Avoid this</text>
  <rect x="530" y="90" width="280" height="50" rx="8" fill="#FFFFFF"/>
  <circle cx="555" cy="115" r="9" fill="#639922"/>
  <text x="580" y="120" font-family="Arial" font-size="14" fill="#5F5E5A">Status dot only, no label</text>
  <rect x="530" y="155" width="280" height="50" rx="8" fill="#FFFFFF"/>
  <circle cx="555" cy="180" r="9" fill="#D85A30"/>
  <text x="580" y="185" font-family="Arial" font-size="14" fill="#5F5E5A">Color alone = invisible to colorblind users</text>
  </svg>
  </div>

  <h2>Accessibility minimums (non-negotiable)</h2>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;display:block;">
  <title>Semantic palette tested in grayscale</title>
  <rect width="900" height="180" fill="#FFFFFF"/>
  <text x="40" y="35" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A">In color</text>
  <circle cx="90" cy="80" r="26" fill="#3B6D11"/>
  <circle cx="170" cy="80" r="26" fill="#A32D2D"/>
  <text x="130" y="130" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Green vs. red — obvious</text>

  <text x="480" y="35" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A">In grayscale</text>
  <circle cx="530" cy="80" r="26" fill="#6B6B6B"/>
  <circle cx="610" cy="80" r="26" fill="#6E6E6E"/>
  <text x="570" y="130" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Nearly identical — adjust lightness, not just hue</text>
  </svg>
  </div>
  <ul>
    <li>Text on any background must meet WCAG AA contrast — 4.5:1 for normal text, 3:1 for large text.</li>
    <li>Never use color as the only signal for status or required fields — always add an icon, label, or pattern.</li>
    <li>Test the semantic palette in grayscale — if green and red look identical, adjust lightness, not just hue.</li>
  </ul>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="26" width="180" height="11" rx="3" fill="#E4E2D8"/><rect x="20" y="47" width="150" height="11" rx="3" fill="#E4E2D8"/><rect x="20" y="68" width="168" height="11" rx="3" fill="#E4E2D8"/><rect x="20" y="89" width="120" height="11" rx="3" fill="#E4E2D8"/><circle cx="280" cy="63" r="11" fill="#3B6D11" class="a-pulse"/><text x="280" y="94" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">1 signal</text></svg>
      <div class="dd-body"><strong>Stay ~85% neutral.</strong> Let a single semantic color mark the one value that needs attention.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="18" y="24" width="120" height="82" rx="8" fill="#FCEBEB" stroke="#A32D2D"/><text x="78" y="68" font-family="Arial" font-size="10" fill="#A32D2D" text-anchor="middle">whole card red</text><rect x="152" y="30" width="148" height="10" rx="3" fill="#A32D2D"/><rect x="152" y="50" width="148" height="10" rx="3" fill="#3B6D11"/><rect x="152" y="70" width="148" height="10" rx="3" fill="#854F0B"/><rect x="152" y="90" width="148" height="10" rx="3" fill="#185FA5"/></svg>

  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Use a restrained color system: neutrals (grays, white, near-black text) for 80%+ of the UI — backgrounds, borders, body text.
Use exactly these semantic colors and never repurpose them: green = success/positive, amber = warning, red = error/negative, blue = informational/selected.
Always pair a status color with an icon or text label, never color alone.
Use the brand accent color only for the primary action button and active navigation state — never on card backgrounds, large surfaces, or decorative elements.
Ensure all text meets WCAG AA contrast against its background.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does the screen feel mostly neutral, with color appearing only where it means something?</li>
    <li>Does every red/amber/green on this screen mean the same thing it means everywhere else?</li>
    <li>Is any status color relying on hue alone, with no icon or label?</li>
    <li>Is brand color used on more than the primary action + nav?</li>
    <li>Does text pass contrast at a glance — no light-gray-on-white, no white-on-yellow?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 2 · Section 1 of 6 — Color</span></footer>
`,



"typography": `
  <div class="part-kicker">Part 2 — Foundations</div>
  <h1>Typography</h1>
  <p>Type is the loudest signal of hierarchy on a screen before anyone reads a word. A dashboard with a consistent, limited type scale reads as ordered; one where every AI-generated screen invents its own sizes reads as noisy, even if every individual size is "fine."</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Type scale ladder from caption to page title</title>
  <rect width="900" height="300" fill="#FFFFFF"/>
  <text x="40" y="60" font-family="Arial" font-weight="700" font-size="32" fill="#2C2C2A">Page title</text>
  <text x="600" y="60" font-family="Arial" font-size="12" fill="#888780">32px / 700</text>
  <text x="40" y="105" font-family="Arial" font-weight="700" font-size="22" fill="#2C2C2A">Section header</text>
  <text x="600" y="105" font-family="Arial" font-size="12" fill="#888780">20px / 600</text>
  <text x="40" y="145" font-family="Arial" font-weight="600" font-size="16" fill="#2C2C2A">Card label</text>
  <text x="600" y="145" font-family="Arial" font-size="12" fill="#888780">16px / 600</text>
  <text x="40" y="180" font-family="Arial" font-weight="400" font-size="15" fill="#5F5E5A">Body copy — regular weight, this is the default size for most text</text>
  <text x="600" y="180" font-family="Arial" font-size="12" fill="#888780">14px / 400</text>
  <text x="40" y="210" font-family="Arial" font-weight="400" font-size="12" fill="#888780">Caption / metadata / timestamps</text>
  <text x="600" y="210" font-family="Arial" font-size="12" fill="#888780">12px / 400</text>
  <text x="40" y="270" font-family="Arial" font-weight="700" font-size="40" fill="#185FA5">482K</text>
  <text x="600" y="270" font-family="Arial" font-size="12" fill="#888780">36–40px / 700 — reserved for KPI numbers only</text>
  <line x1="40" y1="230" x2="860" y2="230" stroke="#D3D1C7" stroke-dasharray="3 4"/>
  </svg>
  </div>

  <h2>The scale</h2>
  <p>Use a fixed set of sizes — no in-between values. A 6-step scale covers nearly every dashboard need:</p>
  <table class="rule-table">
    <tr><th>Role</th><th>Size / weight</th><th>Used for</th></tr>
    <tr><td>Page title</td><td>32px / bold</td><td>One per page, top of the content area</td></tr>
    <tr><td>Section header</td><td>20px / semibold</td><td>Card group titles, panel headers</td></tr>
    <tr><td>Card label</td><td>16px / semibold</td><td>Individual card/component titles</td></tr>
    <tr><td>Body</td><td>14px / regular</td><td>Table cells, descriptions, form values</td></tr>
    <tr><td>Caption</td><td>12px / regular, secondary color</td><td>Timestamps, helper text, metadata</td></tr>
    <tr><td>KPI number</td><td>36–40px / bold</td><td>The single big number on a stat card only</td></tr>
  </table>

  <p><strong>Do:</strong> keep body line-height between 1.4–1.6 for readability at a glance.<br><strong>Don't:</strong> use more than one font family, or introduce a size outside the scale "just this once."</p>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><text x="24" y="50" font-family="Arial" font-size="26" font-weight="700" fill="#2C2C2A">Title</text><text x="24" y="76" font-family="Arial" font-size="13" fill="#5F5E5A">Body copy at one steady size</text><text x="24" y="98" font-family="Arial" font-size="10" fill="#888780">Caption</text></svg>
      <div class="dd-body"><strong>Map every element</strong> to the six-role scale — a handful of sizes, one font family.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><text x="20" y="44" font-family="Arial" font-size="20" fill="#2C2C2A">Big</text><text x="96" y="40" font-family="Arial" font-size="12" fill="#5F5E5A">small</text><text x="150" y="54" font-family="Arial" font-size="27" font-weight="700" fill="#2C2C2A">HUGE</text><text x="24" y="86" font-family="Arial" font-size="15" fill="#5F5E5A">mid</text><text x="80" y="94" font-family="Arial" font-size="22" fill="#2C2C2A">odd</text><text x="184" y="90" font-family="Arial" font-size="11" fill="#888780">tiny</text></svg>
      <div class="dd-body">Don’t invent an off-scale size ‘just this once’ — it reads as noise even when each size is fine.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Use exactly this type scale and nothing outside it: 32px/bold for the page title, 20px/semibold for section headers, 16px/semibold for card labels, 14px/regular for body text, 12px/regular (secondary color) for captions, and 36–40px/bold reserved only for KPI numbers on stat cards.
Use one font family throughout. Body line-height should be 1.4–1.6. Never introduce a new size or weight combination not listed here.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does every text element on the screen map to one of the 6 defined roles?</li>
    <li>Is there exactly one page title, sized larger than everything else?</li>
    <li>Are KPI numbers the only place using the largest, boldest size?</li>
    <li>Is body line-height comfortable to scan, not cramped or overly loose?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 2 · Section 2 of 6 — Typography</span></footer>
`,



"spacing-grid": `
  <div class="part-kicker">Part 2 — Foundations</div>
  <h1>Spacing &amp; Grid</h1>
  <p>Spacing is silent grouping. Before a user reads a single label, the gaps between elements already tell them what belongs together and what doesn't. Inconsistent spacing is one of the fastest ways an AI-generated screen reveals itself — items that should feel related sit slightly too far apart, or unrelated things crowd together.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Spacing scale and grouping example</title>
  <rect width="900" height="320" fill="#FFFFFF"/>
  <text x="40" y="35" font-family="Arial" font-weight="700" font-size="15" fill="#2C2C2A">Spacing scale (base unit = 4px)</text>
  <g font-family="Arial" font-size="11" fill="#5F5E5A" text-anchor="middle">
  <rect x="40" y="55" width="4" height="20" fill="#534AB7"/><text x="42" y="90">4</text>
  <rect x="90" y="55" width="8" height="20" fill="#534AB7"/><text x="94" y="90">8</text>
  <rect x="140" y="55" width="12" height="20" fill="#534AB7"/><text x="146" y="90">12</text>
  <rect x="190" y="55" width="16" height="20" fill="#534AB7"/><text x="198" y="90">16</text>
  <rect x="245" y="55" width="24" height="20" fill="#534AB7"/><text x="257" y="90">24</text>
  <rect x="310" y="55" width="32" height="20" fill="#534AB7"/><text x="326" y="90">32</text>
  <rect x="385" y="55" width="48" height="20" fill="#534AB7"/><text x="409" y="90">48</text>
  <rect x="475" y="55" width="64" height="20" fill="#534AB7"/><text x="507" y="90">64</text>
  </g>
  <text x="40" y="140" font-family="Arial" font-weight="700" font-size="15" fill="#2C2C2A">Related items — tight spacing (8px)</text>
  <rect x="40" y="155" width="130" height="30" rx="6" fill="#F1EFE8"/>
  <rect x="180" y="155" width="130" height="30" rx="6" fill="#F1EFE8"/>
  <rect x="320" y="155" width="130" height="30" rx="6" fill="#F1EFE8"/>
  <text x="40" y="225" font-family="Arial" font-weight="700" font-size="15" fill="#2C2C2A">Unrelated groups — loose spacing (32px)</text>
  <rect x="40" y="240" width="200" height="50" rx="8" fill="#F1EFE8"/>
  <rect x="272" y="240" width="200" height="50" rx="8" fill="#F1EFE8"/>
  <text x="140" y="269" font-family="Arial" font-size="12" fill="#888780" text-anchor="middle">Group A</text>
  <text x="372" y="269" font-family="Arial" font-size="12" fill="#888780" text-anchor="middle">Group B</text>
  </svg>
  </div>

  <h2>The scale</h2>
  <p>Use only multiples of the base unit: <strong>4, 8, 12, 16, 24, 32, 48, 64px</strong>. No arbitrary values like 13px or 27px.</p>
  <table class="rule-table">
    <tr><th>Gap</th><th>Use for</th></tr>
    <tr><td>4–8px</td><td>Inside a component — icon to label, between a KPI value and its unit</td></tr>
    <tr><td>12–16px</td><td>Between closely related elements — form fields in the same section, table cell padding</td></tr>
    <tr><td>24–32px</td><td>Between related but distinct components — cards inside the same group</td></tr>
    <tr><td>48–64px</td><td>Between unrelated sections of a page</td></tr>
  </table>
  <p><strong>Do:</strong> use a 12-column grid with a consistent gutter (24px) for card layouts.<br><strong>Don't:</strong> eyeball spacing per screen — always pick from the scale.</p>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="40" width="52" height="50" rx="6" fill="#F1EFE8"/><rect x="76" y="40" width="52" height="50" rx="6" fill="#F1EFE8"/><rect x="132" y="40" width="52" height="50" rx="6" fill="#F1EFE8"/><rect x="244" y="40" width="52" height="50" rx="6" fill="#F1EFE8"/><text x="102" y="112" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">group A</text><text x="270" y="112" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">group B</text></svg>
      <div class="dd-body"><strong>Group with spacing</strong> — tight within, loose between — using only the 4-based scale.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="40" width="46" height="50" rx="6" fill="#F1EFE8"/><rect x="83" y="40" width="46" height="50" rx="6" fill="#F1EFE8"/><rect x="146" y="40" width="46" height="50" rx="6" fill="#F1EFE8"/><rect x="209" y="40" width="46" height="50" rx="6" fill="#F1EFE8"/><rect x="272" y="40" width="28" height="50" rx="6" fill="#F1EFE8"/><text x="160" y="112" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">all equal — no grouping, odd 13/27px gaps</text></svg>
      <div class="dd-body">Don’t space everything equally or eyeball odd gaps (13px, 27px) — grouping disappears.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Use only these spacing values: 4, 8, 12, 16, 24, 32, 48, 64px — never an arbitrary pixel value.
Use tighter spacing (4–16px) between elements that are conceptually related, and looser spacing (32px+) between unrelated sections, so grouping is visible without needing borders.
Lay out multi-card sections on a 12-column grid with a 24px gutter.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Can you tell what's grouped together just from the spacing, without reading labels?</li>
    <li>Does every gap on the screen match a value from the scale?</li>
    <li>Is spacing between cards in the same section consistent across the whole screen?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 2 · Section 3 of 6 — Spacing &amp; Grid</span></footer>
`,



"elevation": `
  <div class="part-kicker">Part 2 — Foundations</div>
  <h1>Elevation / Shadow</h1>
  <p>Elevation tells a user "this is temporary" or "this sits above the page." It should be reserved for exactly that — not sprinkled on static content to make a screen look more "designed."</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Three elevation levels: flat, raised, and modal</title>
  <defs>
    <filter id="s1" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/></filter>
    <filter id="s2" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/></filter>
  </defs>
  <rect width="900" height="260" fill="#FAFAF7"/>
  <rect x="60" y="70" width="220" height="130" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="170" y="230" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">Level 0 — Flat</text>
  <text x="170" y="248" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Static cards, page content</text>

  <rect x="340" y="60" width="220" height="130" rx="10" fill="#FFFFFF" filter="url(#s1)"/>
  <text x="450" y="230" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">Level 1 — Raised</text>
  <text x="450" y="248" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Dropdowns, popovers, dragged cards</text>

  <rect x="620" y="45" width="220" height="130" rx="10" fill="#FFFFFF" filter="url(#s2)"/>
  <text x="730" y="230" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">Level 2 — Modal</text>
  <text x="730" y="248" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Dialogs, above a page dim overlay</text>
  </svg>
  </div>

  <h2>The scale</h2>
  <table class="rule-table">
    <tr><th>Level</th><th>Shadow</th><th>Use for</th></tr>
    <tr><td>0 — Flat</td><td>None (border only)</td><td>Cards, page sections, anything that lives permanently on the page</td></tr>
    <tr><td>1 — Raised</td><td>Small, soft</td><td>Dropdown menus, tooltips, popovers, a card being dragged</td></tr>
    <tr><td>2 — Modal</td><td>Larger, more diffuse</td><td>Dialogs and modals, always paired with a dimmed background overlay</td></tr>
  </table>
  <p><strong>Do:</strong> use elevation only to indicate temporary or overlay content.<br><strong>Don't:</strong> add a shadow to a static card just to make it "pop" — use a border instead.</p>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><defs><filter id="ddsh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/></filter></defs><rect x="24" y="36" width="120" height="60" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/><text x="84" y="70" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">flat card</text><rect x="176" y="32" width="120" height="60" rx="10" fill="#FFFFFF" filter="url(#ddsh)"/><text x="236" y="66" font-family="Arial" font-size="10" fill="#5F5E5A" text-anchor="middle">popover</text></svg>
      <div class="dd-body"><strong>Shadow means temporary.</strong> Flat, bordered cards; a soft shadow only on overlays.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><defs><filter id="ddsh2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/></filter></defs><rect x="24" y="34" width="80" height="60" rx="10" fill="#FFFFFF" filter="url(#ddsh2)"/><rect x="120" y="34" width="80" height="60" rx="10" fill="#FFFFFF" filter="url(#ddsh2)"/><rect x="216" y="34" width="80" height="60" rx="10" fill="#FFFFFF" filter="url(#ddsh2)"/><text x="160" y="114" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">everything floats</text></svg>
      <div class="dd-body">Don’t drop-shadow static cards to make them ‘pop’ — then nothing reads as elevated.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Use exactly three elevation levels: flat (border only, no shadow) for static page content and cards; a small soft shadow for temporary overlays like dropdowns and popovers; a larger shadow plus a dimmed page background for modals and dialogs.
Never add a shadow to a static, permanently-visible card — use a 1px border instead to separate it from the page background.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does every shadow on the screen correspond to something temporary or overlaid?</li>
    <li>Are static cards using a border instead of a shadow?</li>
    <li>Is there a dimmed backdrop behind every modal?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 2 · Section 4 of 6 — Elevation / Shadow</span></footer>
`,



"iconography": `
  <div class="part-kicker">Part 2 — Foundations</div>
  <h1>Iconography</h1>
  <p>Icons are a visual vocabulary — they only work if the same icon always means the same thing, and if they're drawn in one consistent style. Mixing icon sets (different stroke widths, some filled, some outlined) is as jarring as mixing fonts.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Icon sizing scale and icon-plus-label pairing</title>
  <rect width="900" height="240" fill="#FFFFFF"/>
  <text x="40" y="35" font-family="Arial" font-weight="700" font-size="15" fill="#2C2C2A">Sizing scale — one consistent stroke width</text>
  <circle cx="60" cy="80" r="8" fill="none" stroke="#2C2C2A" stroke-width="1.8"/>
  <text x="60" y="110" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">16px</text>
  <circle cx="140" cy="80" r="10" fill="none" stroke="#2C2C2A" stroke-width="1.8"/>
  <text x="140" y="110" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">20px</text>
  <circle cx="230" cy="80" r="12" fill="none" stroke="#2C2C2A" stroke-width="1.8"/>
  <text x="230" y="110" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">24px</text>

  <text x="450" y="35" font-family="Arial" font-weight="700" font-size="15" fill="#2C2C2A">Icon alone vs. icon + label</text>
  <circle cx="470" cy="80" r="14" fill="none" stroke="#A32D2D" stroke-width="1.8"/>
  <text x="470" y="80" font-family="Arial" font-size="14" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">!</text>
  <text x="470" y="112" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Ambiguous alone</text>

  <rect x="580" y="66" width="150" height="30" rx="6" fill="#FCEBEB"/>
  <circle cx="600" cy="81" r="9" fill="#A32D2D"/>
  <text x="600" y="81" font-family="Arial" font-size="11" font-weight="700" fill="#FCEBEB" text-anchor="middle" dominant-baseline="central">!</text>
  <text x="618" y="86" font-family="Arial" font-size="12" font-weight="700" fill="#501313">Sync failed</text>
  <text x="655" y="112" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Clear with a label</text>
  </svg>
  </div>

  <h2>The rules</h2>
  <ul>
    <li><strong>One icon source</strong> for the whole product — never mix icon libraries or styles (outlined + filled).</li>
    <li><strong>Consistent stroke width</strong> across every icon, typically 1.5–2px.</li>
    <li><strong>Fixed sizing scale</strong>: 16px inline with text, 20px in buttons and nav, 24px for standalone/empty-state icons.</li>
    <li><strong>Never rely on an icon alone</strong> to convey status or action — pair it with a text label, same as color.</li>
  </ul>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="34" width="280" height="62" rx="8" fill="#F1EFE8"/><circle cx="70" cy="65" r="13" fill="none" stroke="#2C2C2A" stroke-width="1.8"/><circle cx="130" cy="65" r="13" fill="none" stroke="#2C2C2A" stroke-width="1.8"/><circle cx="190" cy="65" r="13" fill="none" stroke="#2C2C2A" stroke-width="1.8"/><circle cx="250" cy="65" r="13" fill="none" stroke="#2C2C2A" stroke-width="1.8"/><text x="160" y="112" font-family="Arial" font-size="10" fill="#3B6D11" text-anchor="middle">one set, one stroke width</text></svg>
      <div class="dd-body"><strong>Icon + label.</strong> One icon set, one stroke width, meaning always spelled out.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="34" width="280" height="62" rx="8" fill="#F1EFE8"/><circle cx="70" cy="65" r="13" fill="none" stroke="#2C2C2A" stroke-width="1"/><circle cx="130" cy="65" r="11" fill="#2C2C2A"/><rect x="176" y="53" width="26" height="26" fill="none" stroke="#2C2C2A" stroke-width="2.5"/><circle cx="250" cy="65" r="15" fill="none" stroke="#2C2C2A" stroke-width="3.5"/><text x="160" y="112" font-family="Arial" font-size="10" fill="#A32D2D" text-anchor="middle">4 styles, 4 stroke widths</text></svg>
      <div class="dd-body">Don’t rely on an icon alone for status, or mix filled + outlined sets in one product.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Use a single, consistent icon set throughout — do not mix icon styles or stroke weights.
Use this size scale only: 16px for icons inline with text, 20px for icons in buttons and navigation, 24px for standalone icons (e.g. empty states).
Never use an icon by itself to communicate status, action, or meaning — always pair it with a visible text label.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Do all icons on the screen share the same visual style and stroke width?</li>
    <li>Does every icon size match one of the three defined sizes?</li>
    <li>Is there any icon-only button or status marker with no accompanying label?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 2 · Section 5 of 6 — Iconography</span></footer>
