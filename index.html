"buttons": `
  <div class="part-kicker">Part 4 — Components</div>
  <h1>Buttons &amp; actions</h1>
  <p>Every screen with more than one clickable action needs a clear answer to "which one matters most?" Without that hierarchy, a user has to read every button's label to figure out what to do — with it, they can act on instinct.</p>

  <h2>Three levels, one primary per view</h2>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Button hierarchy: primary, secondary, and tertiary</title>
  <rect width="900" height="160" fill="#FFFFFF"/>
  <rect x="60" y="55" width="150" height="40" rx="6" fill="#534AB7"/>
  <text x="135" y="80" font-family="Arial" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Export report</text>
  <text x="135" y="120" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Primary — one per view</text>
  <rect x="270" y="55" width="150" height="40" rx="6" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text x="345" y="80" font-family="Arial" font-size="13" fill="#2C2C2A" text-anchor="middle">Filter</text>
  <text x="345" y="120" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Secondary — several allowed</text>
  <rect x="480" y="55" width="150" height="40" fill="none"/>
  <text x="555" y="80" font-family="Arial" font-size="13" fill="#534AB7" text-anchor="middle">Cancel</text>
  <text x="555" y="120" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Tertiary — low-stakes/dismiss</text>
  <rect x="690" y="55" width="150" height="40" rx="6" fill="#FCEBEB" stroke="#A32D2D"/>
  <text x="765" y="80" font-family="Arial" font-size="13" font-weight="700" fill="#A32D2D" text-anchor="middle">Delete all</text>
  <text x="765" y="120" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Destructive — needs confirmation</text>
  </svg>
  </div>

  <table class="rule-table">
    <tr><th>Level</th><th>Look</th><th>Rule</th></tr>
    <tr><td>Primary</td><td>Filled, brand color</td><td>Exactly one per view — the single most important action</td></tr>
    <tr><td>Secondary</td><td>Outlined or filled neutral</td><td>Any number — supporting actions (filter, refresh, view options)</td></tr>
    <tr><td>Tertiary</td><td>Text only, no border/fill</td><td>Low-stakes actions — cancel, dismiss, "learn more"</td></tr>
    <tr><td>Destructive</td><td>Red text or red outline</td><td>Never filled solid red for the default state — reserve full-red fill for a confirmation step only</td></tr>
  </table>

  <h2>Disabled and loading states</h2>
  <p>A disabled button must look visibly disabled — reduced opacity or neutral gray, never full color at reduced clickability. Whenever possible, pair it with a reason (a tooltip explaining why, e.g. "Select at least one row to export"), rather than leaving a user to guess why nothing happens. When an action takes longer than roughly 400ms (an export, a save, a report generation), the button must show a loading spinner in place of its label and become non-clickable — never allow a second click to queue a duplicate action.</p>

  <h2>Confirming destructive actions</h2>
  <p>Any action that deletes data, removes access, or can't be easily undone must require a confirmation step — a dialog stating exactly what will be affected (name the specific records/count, not just "Are you sure?"), with the destructive action itself restated as the confirming button's label (e.g. "Delete 42 records," not a generic "Yes").</p>

  <div class="callout"><strong>Do:</strong> make the primary action visually obvious at a glance, and make destructive actions require a specific, named confirmation.<br><strong>Don't:</strong> use more than one primary (filled, brand-colored) button on the same view — it defeats the purpose of the hierarchy.</div>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="46" width="90" height="34" rx="6" fill="#534AB7"/><text x="65" y="67" font-family="Arial" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Export</text><rect x="120" y="46" width="80" height="34" rx="6" fill="#FFFFFF" stroke="#B4B2A9"/><text x="160" y="67" font-family="Arial" font-size="11" fill="#2C2C2A" text-anchor="middle">Filter</text><text x="252" y="67" font-family="Arial" font-size="11" fill="#534AB7" text-anchor="middle">Cancel</text></svg>
      <div class="dd-body"><strong>One primary per view.</strong> Destructive actions confirm with the exact count affected.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="20" y="46" width="86" height="34" rx="6" fill="#534AB7"/><text x="63" y="67" font-family="Arial" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Save</text><rect x="116" y="46" width="86" height="34" rx="6" fill="#534AB7"/><text x="159" y="67" font-family="Arial" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Export</text><rect x="212" y="46" width="86" height="34" rx="6" fill="#534AB7"/><text x="255" y="67" font-family="Arial" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Delete</text><text x="160" y="100" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">three primaries — none wins</text></svg>
      <div class="dd-body">Don’t put several filled brand buttons on one view, or ship a generic ‘Are you sure?’</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Use exactly four button levels: primary (filled, brand accent color, exactly one per view — the single most important action), secondary (outlined or filled neutral, any number, for supporting actions), tertiary (text-only, no border or fill, for low-stakes actions like cancel or dismiss), and destructive (red text or red outline by default — never a solid red fill except inside a confirmation dialog). Disabled buttons must show visibly reduced opacity or neutral gray, and should be paired with a tooltip explaining why when possible. Any action taking longer than 400ms must replace its label with a loading spinner and become non-clickable to prevent duplicate submissions. Any action that deletes data, removes access, or is difficult to undo must require a confirmation dialog stating the specific records or count affected, with the confirming button labeled with the specific action (e.g. "Delete 42 records"), not a generic "Yes" or "Confirm."</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Is there more than one primary (filled, brand-colored) button on this view?</li>
    <li>Does a disabled button look visibly different from an enabled one?</li>
    <li>Does a slow action (400ms+) show a loading state instead of allowing a second click?</li>
    <li>Does every destructive action require a specific, named confirmation?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 4 · Section 7 of 10 — Buttons &amp; actions</span></footer>

"modals": `
  <div class="part-kicker">Part 4 — Components</div>
  <h1>Modals &amp; dialogs</h1>
  <p>A modal interrupts everything else on the screen — that's a powerful and disruptive tool, so it should be reserved for moments that genuinely need full, undivided attention. Using one for something low-stakes trains users to dismiss modals without reading them.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Modal vs. drawer vs. inline expansion</title>
  <rect width="900" height="240" fill="#FFFFFF"/>

  <rect x="30" y="24" width="270" height="160" rx="8" fill="#EFEEE9"/>
  <rect x="30" y="24" width="270" height="160" rx="8" fill="#2C2C2A" opacity="0.28"/>

  <rect x="170" y="108" width="66" height="24" rx="6" fill="#FCEBEB" stroke="#A32D2D"/><text x="203" y="124" font-family="Arial" font-size="10" font-weight="700" fill="#A32D2D" text-anchor="middle">Delete</text>

  <text x="165" y="220" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">centered, dims the page</text>

  <text x="450" y="220" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">details beside the list</text>

  <rect x="600" y="24" width="270" height="160" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>

  <line x1="600" y1="54" x2="870" y2="54" stroke="#F1EFE8"/>

  </g>
  <text x="735" y="204" font-family="Arial" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle">Inline expansion</text>
  <text x="735" y="220" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">more detail in place</text>
  </svg>
  </div>

  <h2>Modal vs. drawer vs. inline expansion</h2>
  <table class="rule-table">
    <tr><th>Pattern</th><th>Use for</th><th>Don't use for</th></tr>
    <tr><td>Modal (centered dialog)</td><td>Confirmations, focused single-task forms (create/edit one record), critical alerts requiring a decision before continuing</td><td>Anything the user might want to reference alongside the page behind it</td></tr>
    <tr><td>Drawer (slides in from the side)</td><td>Viewing/editing details of a row while keeping the list visible, multi-step flows where context matters</td><td>Simple yes/no confirmations — a modal is faster</td></tr>
    <tr><td>Inline expansion</td><td>Showing more detail about one item in place (expanding a table row, an accordion)</td><td>Anything requiring the user's full attention or a decision before proceeding</td></tr>
  </table>

  <h2>Sizing and dismiss behavior</h2>
  <p>Size a modal to its content — never a fixed large size regardless of what's inside. A confirmation dialog should be small (roughly 400–480px wide); a form-based modal can be medium (560–640px); avoid full-screen modals except for genuinely complex multi-step flows.</p>
  <p>Every modal must be dismissible by clicking the backdrop, pressing Esc, and an explicit close (✕) control — except when the modal contains unsaved changes, in which case clicking outside or pressing Esc must trigger a "discard changes?" confirmation rather than silently closing.</p>

  <h2>What never belongs in a modal</h2>
  <p>Never stack a modal on top of another modal. Never put primary navigation inside a modal. Never use a modal for a routine, frequent action a user does dozens of times a day (e.g. don't wrap "mark as read" in a confirmation modal) — reserve the interruption for moments that actually warrant it.</p>

  <div class="callout"><strong>Do:</strong> reserve modals for focused, infrequent, attention-worthy tasks.<br><strong>Don't:</strong> use a modal as the default answer to "where do I put this UI" — a drawer or inline expansion is usually less disruptive and just as effective.</div>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="30" y="26" width="120" height="78" rx="8" fill="#EFEEE9"/><rect x="30" y="26" width="120" height="78" rx="8" fill="#2C2C2A" opacity="0.25"/><rect x="56" y="44" width="70" height="44" rx="8" fill="#FFFFFF" stroke="#D3D1C7" class="a-pop"/><text x="228" y="58" font-family="Arial" font-size="10" fill="#5F5E5A" text-anchor="middle">confirm / focused form</text><text x="228" y="76" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">size to content, Esc closes</text></svg>
      <div class="dd-body"><strong>Reserve modals</strong> for confirmations and focused forms; use a drawer or inline for the rest.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><text x="160" y="20" font-family="Arial" font-size="9" fill="#A32D2D" text-anchor="middle">stacked modals</text><rect x="70" y="30" width="120" height="66" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="104" y="46" width="120" height="66" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/></svg>
      <div class="dd-body">Don’t stack modals, put navigation inside one, or wrap a routine action in a confirmation.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Use a centered modal only for confirmations, focused single-record forms, and critical alerts requiring a decision before continuing. Use a side drawer for viewing or editing details while the underlying list stays visible. Use inline expansion (expanding a row or accordion) for showing more detail about one item without interrupting the page. Size a confirmation modal to roughly 400–480px wide, a form modal to 560–640px wide — never a fixed large size regardless of content, and avoid full-screen modals except for genuinely complex multi-step flows. Every modal must be dismissible via backdrop click, the Escape key, and an explicit close control — except when it contains unsaved changes, in which case dismissal must trigger a "discard changes?" confirmation instead of closing silently. Never stack a modal on top of another modal, never place primary navigation inside a modal, and never wrap a routine, frequent action in a confirmation modal.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Could this modal have been a drawer or inline expansion instead?</li>
    <li>Is the modal sized to its content, not an oversized default?</li>
    <li>Does dismissing a modal with unsaved changes warn before discarding?</li>
    <li>Is any modal stacked on top of another modal?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 4 · Section 8 of 10 — Modals &amp; dialogs</span></footer>

"notifications": `
  <div class="part-kicker">Part 4 — Components</div>
  <h1>Notifications &amp; toasts</h1>
  <p>A toast confirms something just happened and then gets out of the way. A banner tells the user about an ongoing condition and stays until it's resolved. Using the wrong one either makes important, ongoing problems easy to miss, or clutters the screen with permanent clutter for things that were already handled.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Transient toast vs. persistent banner</title>
  <rect width="900" height="230" fill="#FFFFFF"/>

  <rect x="30" y="24" width="400" height="176" rx="8" fill="#F1EFE8"/>
  <rect x="222" y="36" width="192" height="40" rx="8" fill="#FFFFFF" stroke="#D3D1C7" class="a-indown"/>
  <g class="a-indown">
  <circle cx="242" cy="52" r="7" fill="#3B6D11"/><path d="M238 52 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="258" y="52" font-family="Arial" font-size="11" font-weight="700" fill="#2C2C2A">Report exported</text>
  <rect x="222" y="72" width="192" height="4" rx="2" fill="#BEDA98" class="a-timer"/>
  </g>
  <rect x="222" y="84" width="192" height="40" rx="8" fill="#FFFFFF" stroke="#D3D1C7" opacity="0.9"/>
  <circle cx="242" cy="100" r="7" fill="#3B6D11"/><path d="M238 100 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="258" y="100" font-family="Arial" font-size="11" fill="#5F5E5A">Changes saved</text>
  <text x="230" y="176" font-family="Arial" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle">Toast</text>
  <text x="230" y="192" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">transient &#183; top-right &#183; auto-dismiss &#183; stacks newest on top</text>

  <rect x="470" y="24" width="400" height="176" rx="8" fill="#F1EFE8"/>
  <rect x="486" y="40" width="368" height="34" rx="6" fill="#FAEEDA" stroke="#E4C489"/>
  <circle cx="508" cy="57" r="8" fill="#854F0B"/><text x="508" y="61" font-family="Arial" font-size="11" font-weight="700" fill="#FAEEDA" text-anchor="middle">!</text>
  <text x="524" y="61" font-family="Arial" font-size="11" font-weight="700" fill="#412402">3 items failed to sync &#8212; retry</text>
  <text x="838" y="61" font-family="Arial" font-size="12" fill="#854F0B" text-anchor="end">&#215;</text>
  <rect x="486" y="86" width="368" height="12" rx="3" fill="#E4E2D8"/>
  <rect x="486" y="106" width="300" height="12" rx="3" fill="#E4E2D8"/>
  <rect x="486" y="126" width="340" height="12" rx="3" fill="#E4E2D8"/>
  <text x="670" y="176" font-family="Arial" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle">Banner</text>
  <text x="670" y="192" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">persistent &#183; tied to page state &#183; stays until resolved</text>
  </svg>
  </div>

  <h2>Toast vs. banner</h2>
  <table class="rule-table">
    <tr><th>Pattern</th><th>Use for</th><th>Behavior</th></tr>
    <tr><td>Toast (transient)</td><td>Confirming a just-completed action — "Report exported," "Changes saved," "Row deleted"</td><td>Appears, auto-dismisses, never requires action to close</td></tr>
    <tr><td>Banner (persistent)</td><td>An ongoing condition tied to the page's state — "3 items failed to sync," "You're viewing cached data from 10 minutes ago"</td><td>Stays visible until the underlying condition is resolved or the user dismisses it explicitly</td></tr>
  </table>

  <h2>Placement, stacking, and timing</h2>
  <p>Show toasts in a single consistent screen corner (top-right is the most common convention) — never in the center, where they'd block content. When more than one toast fires in quick succession, stack them vertically with the newest on top rather than replacing the previous one before it's been seen.</p>
  <p>Auto-dismiss timing by severity: success/info toasts dismiss automatically after 4–5 seconds; warning toasts after 6–8 seconds; error toasts should not auto-dismiss at all — they require an explicit close, since a user may be away from the screen when the error occurs.</p>

  <div class="callout"><strong>Do:</strong> use a toast for anything the user already knows the outcome of (they just clicked "save") and a banner for anything they need to keep knowing about.<br><strong>Don't:</strong> auto-dismiss error toasts, and don't use more than one banner at a time — stack of banners reads as broken, not informative.</div>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="150" y="34" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#D3D1C7" class="a-indown"/><circle cx="170" cy="51" r="7" fill="#3B6D11"/><path d="M166 51 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="55" font-family="Arial" font-size="10" font-weight="700" fill="#2C2C2A">Saved</text><rect x="150" y="66" width="150" height="4" rx="2" fill="#BEDA98" class="a-timer"/><text x="80" y="55" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">success · 4–5s</text></svg>
      <div class="dd-body"><strong>Toast to confirm, banner for ongoing.</strong> Top-right; stack the newest on top.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="150" y="42" width="150" height="34" rx="8" fill="#FCEBEB" stroke="#A32D2D"/><text x="225" y="63" font-family="Arial" font-size="10" font-weight="700" fill="#A32D2D" text-anchor="middle">Error — gone in 4s</text><text x="80" y="62" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">missed it</text></svg>
      <div class="dd-body">Don’t auto-dismiss errors, stack multiple banners, or center a toast over content.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Use a transient toast notification only to confirm an action the user just completed (e.g. "Report exported," "Changes saved"). Use a persistent banner, anchored to the top of the relevant page or section, for any ongoing condition tied to the page's state (e.g. sync failures, stale/cached data) — the banner must remain visible until the condition is resolved or explicitly dismissed. Show toasts in a single consistent corner of the screen (top-right), stacking new toasts above older ones rather than replacing them. Auto-dismiss success and informational toasts after 4–5 seconds and warning toasts after 6–8 seconds; error toasts must never auto-dismiss and require an explicit close action. Never show more than one persistent banner at the same time on the same page.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Is an ongoing condition shown as a toast that will disappear before it's resolved?</li>
    <li>Do error toasts auto-dismiss (they shouldn't)?</li>
    <li>Are multiple toasts stacking correctly, or replacing each other before being seen?</li>
    <li>Is there more than one banner competing for attention on the same page?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 4 · Section 9 of 10 — Notifications &amp; toasts</span></footer>

"data-export": `
  <div class="part-kicker">Part 4 — Components</div>
  <h1>Data export &amp; reporting</h1>
  <p>Almost every statistical dashboard eventually gets the request "can I get this in Excel/PDF for a meeting." Treat export as a first-class feature, not an afterthought bolted onto a table.</p>

  <div class="diagram-wrap">

  <rect x="500" y="78" width="150" height="94" rx="8" fill="#FFFFFF" stroke="#D3D1C7" class="a-indown"/>

  </div>

  <h2>Where export controls live</h2>
  <p>Place the export action directly adjacent to the data it exports — in the page header if it exports the whole view, or inside a table's toolbar if it exports just that table. Never bury export inside a generic overflow/settings menu if it's a common action for that screen.</p>

  <h2>Format choice</h2>
  <table class="rule-table">
    <tr><th>Format</th><th>Use for</th></tr>
    <tr><td>CSV</td><td>Raw tabular data someone will re-analyze, filter, or pivot elsewhere</td></tr>
    <tr><td>PDF</td><td>A formatted report meant to be read or shared as-is (includes charts, headers, branding)</td></tr>
    <tr><td>Print view</td><td>A simplified, high-contrast layout for physical printing — strip sidebar/nav, expand truncated columns</td></tr>
  </table>
  <p>If a screen only needs one format, default to CSV for data-heavy tables and PDF for anything containing charts or KPI summaries meant for a non-technical reader.</p>

  <h2>Handling exports too large to generate instantly</h2>
  <p>If an export can't complete in roughly 2–3 seconds, don't block the UI waiting for it. Show a toast confirming the export has started, generate it in the background, and notify the user (toast, or a small download-ready indicator) when it's ready — never leave a spinner running with no explanation for tens of seconds.</p>

  <div class="callout"><strong>Do:</strong> respect the current filters and date range when exporting — the export should match exactly what the user is looking at.<br><strong>Don't:</strong> silently export the full unfiltered dataset when the user has filters applied — this is a common, confusing bug, not a feature.</div>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="30" width="200" height="72" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="34" y="42" width="120" height="9" rx="2" fill="#E4E2D8"/><rect x="34" y="58" width="120" height="9" rx="2" fill="#F1EFE8"/><rect x="34" y="74" width="120" height="9" rx="2" fill="#E4E2D8"/><rect x="164" y="40" width="52" height="22" rx="6" fill="#534AB7"/><text x="190" y="55" font-family="Arial" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Export</text><text x="264" y="60" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">CSV / PDF</text></svg>
      <div class="dd-body"><strong>Export beside the data</strong> — CSV for raw, PDF for reports — respecting the active filters.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="30" width="200" height="72" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/><text x="255" y="44" font-family="Arial" font-size="15" fill="#888780" text-anchor="middle">⋯</text><text x="255" y="70" font-family="Arial" font-size="8" fill="#A32D2D" text-anchor="middle">buried menu</text><text x="124" y="120" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">exports full dataset, ignoring filters</text></svg>
      <div class="dd-body">Don’t bury export in a generic ⋯ menu, or export the full dataset when filters are applied.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Place export controls directly adjacent to the data they export — in the page header for a whole-view export, or in a table's own toolbar for a single-table export — never inside a generic overflow menu if export is a common action on that screen. Offer CSV for raw tabular data intended for further analysis, and PDF for formatted reports containing charts or KPI summaries. The exported data must respect whatever filters, date range, and sort order are currently active on the screen — never export the full unfiltered dataset by default. If generating the export will take longer than roughly 2–3 seconds, do not block the UI with a spinner — show a toast confirming the export has started, generate it in the background, and surface a clear notification when the file is ready to download.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Is the export control placed next to the data it exports, not buried in a settings menu?</li>
    <li>Does the exported file match the currently active filters, not the full unfiltered dataset?</li>
    <li>Does a slow export show background progress instead of a blocking spinner?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 4 · Section 10 of 10 — Data export &amp; reporting</span></footer>

"states": `
  <div class="part-kicker">Part 5 — States</div>
  <h1>Empty, loading, error &amp; more</h1>
  <p>This is the most commonly skipped part of any AI-generated build. It's easy to design the "happy path" with perfect sample data — the real test is whether the screen still makes sense with zero rows, a slow connection, or a failed request.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Empty, loading, and error state mockups</title>
  <rect width="900" height="220" fill="#FFFFFF"/>

  <rect x="30" y="20" width="270" height="180" rx="8" fill="#F1EFE8"/>
  <text x="165" y="40" font-family="Arial" font-size="10" font-weight="700" fill="#888780" text-anchor="middle">EMPTY &#8212; FIRST USE</text>
  <rect x="46" y="50" width="238" height="138" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <circle cx="165" cy="90" r="20" fill="#FAFAF7" stroke="#D3D1C7"/>
  <text x="165" y="97" font-family="Arial" font-size="16" fill="#B4B2A9" text-anchor="middle">＋</text>
  <text x="165" y="130" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle">No reports yet</text>
  <text x="165" y="147" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">Create your first report to see it here</text>
  <rect x="120" y="158" width="90" height="20" rx="6" fill="#534AB7"/>
  <text x="165" y="172" font-family="Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">Create report</text>

  <rect x="315" y="20" width="270" height="180" rx="8" fill="#F1EFE8"/>
  <text x="450" y="40" font-family="Arial" font-size="10" font-weight="700" fill="#888780" text-anchor="middle">LOADING &#8212; SKELETON</text>
  <rect x="331" y="50" width="238" height="138" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="347" y="70" width="206" height="14" rx="4" fill="#EFEEE9"/>
  <rect x="347" y="92" width="160" height="14" rx="4" fill="#EFEEE9"/>
  <rect x="347" y="114" width="180" height="14" rx="4" fill="#EFEEE9"/>
  <rect x="347" y="140" width="206" height="38" rx="6" fill="#EFEEE9"/>

  <rect x="600" y="20" width="270" height="180" rx="8" fill="#F1EFE8"/>
  <text x="735" y="40" font-family="Arial" font-size="10" font-weight="700" fill="#888780" text-anchor="middle">ERROR</text>
  <rect x="616" y="50" width="238" height="138" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <circle cx="735" cy="88" r="18" fill="#FCEBEB"/>
  <text x="735" y="94" font-family="Arial" font-size="14" font-weight="700" fill="#A32D2D" text-anchor="middle">!</text>
  <text x="735" y="128" font-family="Arial" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle">Couldn't load data</text>
  <text x="735" y="145" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">Check your connection and retry</text>
  <rect x="690" y="156" width="90" height="20" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="735" y="170" font-family="Arial" font-size="10" fill="#5F5E5A" text-anchor="middle">Retry</text>
  </svg>
  </div>

  <h2>The six states to design for every data view</h2>
  <table class="rule-table">
    <tr><th>State</th><th>What to show</th></tr>
    <tr><td>Empty — first use</td><td>What this view is for, plus a clear action to create the first item.</td></tr>
    <tr><td>Empty — filtered to nothing</td><td>State that the filters returned zero results, and offer "Clear filters" — different from first-use empty.</td></tr>
    <tr><td>Loading</td><td>Skeleton shapes matching the eventual layout, not a generic spinner, for anything that takes &gt;500ms.</td></tr>
    <tr><td>Error</td><td>What happened, in plain language, plus a retry action — never a raw error code alone.</td></tr>
    <tr><td>Partial data</td><td>Show what did load, and flag clearly which part failed, rather than hiding the whole view.</td></tr>
    <tr><td>Real-time update</td><td>A subtle, non-disruptive indicator (e.g. a small "Updated just now" or pulsing dot) — never a layout jump.</td></tr>
    <tr><td>Permission denied</td><td>Explain that access is restricted and who to contact — visually distinct from "not found."</td></tr>
  </table>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="28" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="34" y="38" width="150" height="12" rx="3" fill="#E4E2D8" class="a-pulse"/><rect x="34" y="58" width="120" height="12" rx="3" fill="#E4E2D8" class="a-pulse"/><rect x="34" y="82" width="252" height="16" rx="4" fill="#E4E2D8" class="a-pulse"/></svg>
      <div class="dd-body"><strong>Design every state:</strong> empty, filtered-empty, loading skeleton, error, partial, denied.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="28" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/><circle cx="160" cy="64" r="12" fill="none" stroke="#D3D1C7" stroke-width="3" stroke-dasharray="40 20" class="a-spin"/><text x="160" y="120" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">bare spinner, no context</text></svg>
      <div class="dd-body">Don’t ship only the happy path — a bare centered spinner or blank page tells the user nothing.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">For every data view you build, design all of these states, not just the happy path with sample data: first-use empty state (with an action to create the first item), filtered-to-zero-results empty state (with a "clear filters" action), loading state using skeleton shapes that match the real layout, error state with a plain-language explanation and retry action, partial-data state that shows what did load while flagging what failed, a non-disruptive real-time update indicator, and a permission-denied state that's visually distinct from a not-found state.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does this screen work with zero data, not just sample data?</li>
    <li>Is the loading state a skeleton, not a generic centered spinner?</li>
    <li>Does the error state explain what happened and offer a way to recover?</li>
    <li>Is "no results from filters" visually different from "nothing exists yet"?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 5 · States</span></footer>
`,



"a11y-content": `
  <div class="part-kicker">Part 6 — Accessibility &amp; Content</div>
  <h1>Accessibility &amp; content design</h1>
  <p>Accessibility and content clarity aren't a final pass — they're what makes the rest of this guide actually work for every user, not just the ones who can see color clearly and read quickly.</p>

  <h2>Contrast minimums</h2>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Contrast pass versus fail examples</title>
  <rect width="900" height="200" fill="#FFFFFF"/>
  <rect x="40" y="30" width="380" height="140" rx="8" fill="#EAF3DE"/>
  <text x="230" y="55" font-family="Arial" font-size="13" font-weight="700" fill="#3B6D11" text-anchor="middle">Pass — 4.6:1</text>
  <rect x="70" y="75" width="320" height="70" rx="6" fill="#FFFFFF"/>
  <text x="90" y="118" font-family="Arial" font-size="16" fill="#2C2C2A">Dark gray text on white</text>

  <rect x="460" y="30" width="380" height="140" rx="8" fill="#FCEBEB"/>
  <text x="650" y="55" font-family="Arial" font-size="13" font-weight="700" fill="#A32D2D" text-anchor="middle">Fail — 2.1:1</text>
  <rect x="490" y="75" width="320" height="70" rx="6" fill="#FFFFFF"/>
  <text x="510" y="118" font-family="Arial" font-size="16" fill="#C9C7BE">Light gray text on white</text>
  </svg>
  </div>
  <ul>
    <li>Body text: 4.5:1 against its background (WCAG AA).</li>
    <li>Large text (18px+ bold, or 24px+ regular): 3:1 minimum.</li>
    <li>This applies beyond body copy — chart labels, table headers, and placeholder text all need to pass, not just paragraph text.</li>
  </ul>

  <h2>Number &amp; date formatting</h2>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Consistent versus inconsistent number and date formatting</title>
  <rect width="900" height="190" fill="#FFFFFF"/>
  <rect x="40" y="20" width="380" height="150" rx="8" fill="#EAF3DE"/>
  <text x="230" y="52" font-family="Arial" font-size="12" font-weight="700" fill="#173404" text-anchor="middle">Consistent</text>
  <text x="65" y="88" font-family="Arial" font-size="13" fill="#2C2C2A">Jul 31, 2026</text>
  <text x="65" y="114" font-family="Arial" font-size="13" fill="#2C2C2A">$12,400.00</text>
  <text x="65" y="140" font-family="Arial" font-size="13" fill="#2C2C2A">Aug 2, 2026</text>

  <rect x="460" y="20" width="380" height="150" rx="8" fill="#FCEBEB"/>
  <text x="650" y="52" font-family="Arial" font-size="12" font-weight="700" fill="#501313" text-anchor="middle">Mixed formats</text>
  <text x="485" y="88" font-family="Arial" font-size="13" fill="#2C2C2A">7/31/2026</text>
  <text x="485" y="114" font-family="Arial" font-size="13" fill="#2C2C2A">12400</text>
  <text x="485" y="140" font-family="Arial" font-size="13" fill="#2C2C2A">2 Aug '26</text>
  </svg>
  </div>
  <ul>
    <li>Pick one locale format and use it everywhere — don't mix "3/4/2026" and "4 Mar 2026" across screens.</li>
    <li>Use consistent precision: if revenue is shown to the nearest thousand on one card, don't show exact cents on another.</li>
    <li>Always show the unit — "$", "%", "ms" — never a bare number a user has to infer.</li>
  </ul>

  <h2>Plain-language copy</h2>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>System language versus plain language</title>
  <rect width="900" height="150" fill="#FFFFFF"/>
  <rect x="40" y="20" width="380" height="110" rx="8" fill="#FCEBEB"/>
  <text x="230" y="45" font-family="Arial" font-size="12" font-weight="700" fill="#501313" text-anchor="middle">System language</text>
  <text x="65" y="80" font-family="Arial" font-size="13" fill="#2C2C2A">"Webhook config"</text>
  <text x="65" y="110" font-family="Arial" font-size="13" fill="#2C2C2A">"Something went wrong"</text>

  <rect x="460" y="20" width="380" height="110" rx="8" fill="#EAF3DE"/>
  <text x="650" y="45" font-family="Arial" font-size="12" font-weight="700" fill="#173404" text-anchor="middle">Plain language</text>
  <text x="485" y="80" font-family="Arial" font-size="13" fill="#2C2C2A">"Notifications"</text>
  <text x="485" y="110" font-family="Arial" font-size="13" fill="#2C2C2A">"Export failed — try again"</text>
  </svg>
  </div>
  <ul>
    <li>Name things the way a user thinks about them, not the way the system is built — "Notifications," not "Webhook config."</li>
    <li>Errors state what went wrong and how to fix it — never just "Something went wrong."</li>
    <li>Empty states are an invitation to act, not just an absence — say what to do next.</li>
  </ul>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="30" width="272" height="40" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><text x="34" y="55" font-family="Arial" font-size="14" fill="#2C2C2A">Export failed — try again</text><text x="24" y="92" font-family="Arial" font-size="9" fill="#3B6D11">4.5:1 · plain language · units shown</text></svg>
      <div class="dd-body"><strong>AA contrast, plain words.</strong> One date &amp; number format, units always shown.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="30" width="272" height="40" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><text x="34" y="55" font-family="Arial" font-size="14" fill="#C9C7BE">Webhook config error 0x5</text><text x="24" y="92" font-family="Arial" font-size="9" fill="#A32D2D">2:1 · system jargon · bare number</text></svg>
      <div class="dd-body">Don’t use light-gray-on-white, mix date formats, or surface raw system jargon.</div>
    </div>
  </div>


  <h2>Prompting an AI coding agent</h2>
  <blockquote class="prompt">Ensure all text meets WCAG AA contrast (4.5:1 normal, 3:1 large) — including chart labels, table headers, and placeholder text, not just body copy.
Use one consistent date format and one consistent numeric precision across the entire product. Always show units alongside numbers.
Write all labels, empty states, and error messages in plain language from the user's point of view — name features by what the user does with them, and make every error message explain what happened and how to fix it.</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Does every piece of text pass contrast, including small captions and chart labels?</li>
    <li>Are dates and numbers formatted the same way on every screen?</li>
    <li>Would a non-technical user understand every label and error message without translation?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 6 · Accessibility &amp; content design</span></footer>
`,



"pre-prompt": `
  <div class="part-kicker">Part 1 — Working with AI agents</div>
  <h1>Pre-prompt checklist</h1>
  <p>The five minutes spent deciding what a screen is <em>for</em>, before writing the prompt, save far more time than fixing an AI-generated screen after the fact.</p>
  <p>Four questions decide the shape of the screen &#8212; the one metric that matters, the audience, how often the data changes, and which parts of this guide apply. Answer them before you write a word of the prompt.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Four questions to answer before prompting</title>
  <rect width="900" height="200" fill="#FFFFFF"/>
  <g font-family="Arial" text-anchor="middle">
  <g class="a-indown" style="animation-delay:0ms">
  <rect x="30" y="30" width="200" height="120" rx="8" fill="#F1EFE8"/>
  <circle cx="130" cy="70" r="22" fill="none" stroke="#534AB7" stroke-width="2.5"/>
  <circle cx="130" cy="70" r="13" fill="none" stroke="#534AB7" stroke-width="2.5"/>
  <circle cx="130" cy="70" r="5" fill="#534AB7" class="a-pulse"/>
  <text x="130" y="112" font-size="12" font-weight="700" fill="#2C2C2A">Primary metric</text>
  <text x="130" y="130" font-size="10" fill="#888780">What must this screen answer?</text>
  </g>
  <g class="a-indown" style="animation-delay:60ms">
  <rect x="245" y="30" width="200" height="120" rx="8" fill="#F1EFE8"/>
  <circle cx="332" cy="64" r="9" fill="#5F5E5A"/><path d="M317 86 a15 13 0 0 1 30 0 z" fill="#5F5E5A"/>
  <circle cx="356" cy="68" r="7" fill="#888780"/><path d="M345 86 a11 10 0 0 1 22 0 z" fill="#888780"/>
  <text x="345" y="112" font-size="12" font-weight="700" fill="#2C2C2A">Audience</text>
  <text x="345" y="130" font-size="10" fill="#888780">Who reads this, how often?</text>
  </g>
  <g class="a-indown" style="animation-delay:120ms">
  <rect x="460" y="30" width="200" height="120" rx="8" fill="#F1EFE8"/>
  <circle cx="560" cy="70" r="22" fill="none" stroke="#2C2C2A" stroke-width="2.5"/>
  <line x1="560" y1="70" x2="560" y2="56" stroke="#2C2C2A" stroke-width="2.5" stroke-linecap="round" class="p-clockhand"/>
  <line x1="560" y1="70" x2="572" y2="70" stroke="#5F5E5A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="560" cy="70" r="2.5" fill="#2C2C2A"/>
  <text x="560" y="112" font-size="12" font-weight="700" fill="#2C2C2A">Update frequency</text>
  <text x="560" y="130" font-size="10" fill="#888780">Real-time, daily, on-demand?</text>
  </g>
  <g class="a-indown" style="animation-delay:180ms">
  <rect x="675" y="30" width="200" height="120" rx="8" fill="#F1EFE8"/>
  <rect x="742" y="52" width="66" height="40" rx="4" fill="#FFFFFF" stroke="#534AB7" stroke-width="2"/>
  <path d="M752 62 l6 6 l12 -12" fill="none" stroke="#3B6D11" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="752" y1="80" x2="798" y2="80" stroke="#B4B2A9" stroke-width="2"/>
  <text x="775" y="112" font-size="12" font-weight="700" fill="#2C2C2A">Relevant sections</text>
  <text x="775" y="130" font-size="10" fill="#888780">Which parts of this guide apply?</text>
  </g>
  </g>
  </svg>
  </div>

  <h2>Decide before you prompt</h2>
  <ol>
    <li><strong>Primary metric or decision</strong> — the one thing this screen must let someone answer at a glance.</li>
    <li><strong>Audience</strong> — an executive skimming once a week needs a different density than an analyst living in the screen all day.</li>
    <li><strong>Update frequency</strong> — real-time data needs a freshness indicator and different loading treatment than a daily report.</li>
    <li><strong>Which sections of this guide apply</strong> — a table-heavy screen leans on Tables + States; a monitoring screen leans on Information hierarchy + Color.</li>
  </ol>
  <p>Answering these first turns a vague ask ("build me a dashboard") into a specific one the agent can actually follow consistently.</p>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="34" width="272" height="60" rx="8" fill="#EDEBFA"/><text x="36" y="58" font-family="Arial" font-size="10" fill="#534AB7">One-line purpose:</text><text x="36" y="80" font-family="Arial" font-size="11" fill="#2C2C2A">“Show which region is off-target this week.”</text></svg>

  <h2>Reviewer checklist</h2>

"style-presets": `
  <div class="part-kicker">Part 1 — Working with AI agents</div>
  <h1>Style presets</h1>
  <p>Everything in Parts 2–6 is written as fixed numbers — a specific type scale, a specific spacing unit, a specific corner radius. If every developer pastes the same numbers, every product ends up with the same skeleton, differing only by which brand color got swapped in. That's often not what you want across fifty different products built by fifty different people.</p>

  <div class="callout"><strong>You don't need to know what "spacing unit" or "type scale ratio" mean.</strong> Look at the three pictures below. Pick the one that matches the feel of what you're building. Copy the block underneath it. That's the entire decision.</div>

  <h2>Pick by looking, not by knowing terms</h2>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Three style presets: Dense and Efficient, Balanced, Spacious and Calm</title>
  <rect width="900" height="300" fill="#FFFFFF"/>

  <rect x="30" y="20" width="260" height="230" rx="8" fill="#F1EFE8"/>
  <rect x="45" y="34" width="230" height="18" rx="2" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="45" y="58" width="70" height="46" rx="2" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="121" y="58" width="70" height="46" rx="2" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="197" y="58" width="78" height="46" rx="2" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="45" y="110" width="230" height="16" rx="2" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="45" y="130" width="230" height="16" rx="2" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="45" y="150" width="230" height="16" rx="2" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="45" y="170" width="230" height="16" rx="2" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="160" y="210" font-family="Arial" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">Dense &amp; Efficient</text>
  <text x="160" y="228" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">Internal ops tools,</text>
  <text x="160" y="240" font-family="Arial" font-size="10" fill="#888780" text-anchor="middle">monitoring screens</text>

  <rect x="320" y="20" width="260" height="230" rx="10" fill="#F1EFE8"/>
  <rect x="340" y="38" width="220" height="20" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="340" y="70" width="66" height="52" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="420" y="70" width="66" height="52" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="500" y="70" width="60" height="52" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="340" y="136" width="220" height="18" rx="4" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="340" y="160" width="220" height="18" rx="4" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="450" y="210" font-family="Arial" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">Balanced</text>
  <text x="450" y="228" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Default — most</text>
  <text x="450" y="240" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">general-purpose dashboards</text>

  <rect x="610" y="20" width="260" height="230" rx="16" fill="#F1EFE8"/>
  <rect x="635" y="44" width="210" height="24" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="635" y="86" width="95" height="66" rx="16" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="750" y="86" width="95" height="66" rx="16" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="635" y="168" width="210" height="20" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="740" y="216" font-family="Arial" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">Spacious &amp; Calm</text>
  <text x="740" y="234" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Executive reports,</text>
  <text x="740" y="246" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">client-facing dashboards</text>
  </svg>
  </div>

  <h2>Dense &amp; Efficient</h2>
  <p>Packs more onto one screen. Best for internal tools used by power users who scan the same screen many times a day and want less scrolling, not more polish.</p>
  <blockquote class="prompt">Use this style preset: type scale 28px/bold page title, 18px/semibold section headers, 14px/semibold card labels, 13px/regular body text, 11px/regular captions, 30px/bold KPI numbers.
Spacing scale: 2, 4, 8, 12, 16, 24, 32px. Corner radius: 2px on all cards, inputs, and buttons. Elevation: flat/bordered only — no soft shadows, even on overlays; use a 1px border and slight background dim instead.</blockquote>

  <h2>Balanced (default)</h2>
  <p>The preset used throughout the rest of this guide. Recommended unless there's a specific reason to choose otherwise.</p>
  <blockquote class="prompt">Use this style preset: type scale 32px/bold page title, 20px/semibold section headers, 16px/semibold card labels, 14px/regular body text, 12px/regular captions, 36–40px/bold KPI numbers.
Spacing scale: 4, 8, 12, 16, 24, 32, 48, 64px. Corner radius: 8px on cards and inputs, 6px on buttons. Elevation: flat for static cards, soft shadow for dropdowns/popovers, larger shadow + dimmed background for modals.</blockquote>

  <h2>Spacious &amp; Calm</h2>
  <p>Fewer things per screen, more breathing room. Best for dashboards a client, executive, or non-daily user will look at — where the goal is easy scanning over information density.</p>
  <blockquote class="prompt">Use this style preset: type scale 36px/bold page title, 22px/semibold section headers, 17px/semibold card labels, 15px/regular body text, 13px/regular captions, 42px/bold KPI numbers.
Spacing scale: 8, 16, 24, 32, 48, 64, 96px. Corner radius: 16px on cards, 12px on inputs and buttons. Elevation: flat for static cards, a more visible soft shadow for dropdowns/popovers, and a pronounced shadow + dimmed background for modals.</blockquote>

  <h2>The one thing every preset still needs from you</h2>
  <p>Regardless of which preset you pick, you still supply one value: the brand accent color, as a single hex code (get this from whoever owns the brand — marketing, a logo file, an existing website). Nothing else about color changes — the semantic colors (green/amber/red/blue) and neutral scale in Part 2 stay exactly as written for every preset and every product.</p>

  <h2>Dark mode — a second one-time decision</h2>
  <p>Does this specific product need dark mode? Say yes if it's a monitoring/NOC-style screen that's often on a wall display or viewed in a dim room for long stretches. Say no by default for anything else — dark mode adds real implementation cost, and adding it "just in case" usually means it gets built once and never properly maintained.</p>
  <p>If yes, don't invert colors automatically — that breaks contrast ratios. Use a second, purpose-built neutral scale:</p>
  <blockquote class="prompt">If dark mode is needed for this product, use a dedicated dark neutral scale rather than inverting the light one: background #121212, surface/card #1E1E1E, border #2E2E2E, secondary text #A0A0A0, primary text #F2F2F0. Do not simply invert the light-mode hex values. Keep the semantic colors (green/amber/red/blue) and the brand accent color the same hue, but raise their lightness slightly so they still meet 4.5:1 contrast against the dark backgrounds above. Never mix light-mode and dark-mode neutrals on the same screen.</blockquote>

  <div class="callout"><strong>Do:</strong> pick one preset per product, once, at kickoff — not per screen.<br><strong>Don't:</strong> mix presets within the same product, and don't let each developer on the same product choose independently — that recreates the inconsistency problem this section exists to prevent.</div>
  
  <h2>Do’s &amp; Don’ts</h2>
  <div class="dodont">
    <div class="dd-card do">
      <div class="dd-head"><span>✓ Do</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="34" width="80" height="60" rx="6" fill="#EDEBFA" stroke="#534AB7"/><text x="64" y="68" font-family="Arial" font-size="10" font-weight="700" fill="#534AB7" text-anchor="middle">Balanced</text><text x="120" y="68" font-family="Arial" font-size="16" fill="#B4B2A9">→</text><rect x="150" y="34" width="46" height="60" rx="4" fill="#F1EFE8"/><rect x="204" y="34" width="46" height="60" rx="4" fill="#F1EFE8"/><rect x="258" y="34" width="42" height="60" rx="4" fill="#F1EFE8"/><text x="225" y="112" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">every screen, same preset</text></svg>
      <div class="dd-body"><strong>Pick one preset per product</strong> at kickoff, plus the brand hex — that’s the whole decision.</div>
    </div>
    <div class="dd-card dont">
      <div class="dd-head"><span>✕ Don’t</span></div>
      <svg class="dd-art" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;"><rect x="24" y="34" width="80" height="60" rx="2" fill="#F1EFE8"/><text x="64" y="68" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">dense</text><rect x="120" y="34" width="80" height="60" rx="10" fill="#F1EFE8"/><text x="160" y="68" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">balanced</text><rect x="216" y="34" width="80" height="60" rx="18" fill="#F1EFE8"/><text x="256" y="68" font-family="Arial" font-size="9" fill="#888780" text-anchor="middle">spacious</text><text x="160" y="112" font-family="Arial" font-size="9" fill="#A32D2D" text-anchor="middle">three presets, one product</text></svg>
      <div class="dd-body">Don’t mix presets across screens, or let each developer choose independently.</div>
    </div>
  </div>


  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Has one preset been chosen for the whole product, documented somewhere the whole team can see?</li>
    <li>Did the brand hex color get supplied, rather than left as whatever the AI agent defaulted to?</li>
    <li>Do all screens in this product use the same preset — no screen-by-screen drift?</li>
    <li>If dark mode is enabled, is it using the dedicated dark neutral scale rather than inverted light-mode colors?</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 1 · Section 2 of 4 — Style presets</span></footer>

"prompt-scaffold": `
  <div class="part-kicker">Part 1 — Working with AI agents</div>
  <h1>Ready-made prompt scaffolding</h1>
  <p>Rather than hunting through every section for its individual prompt block, use this as a single starting layer for any new dashboard build — then add your screen-specific ask on top of it.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Layered prompt: foundation, accessibility, layout, components, states, then the specific ask</title>
  <rect width="900" height="260" fill="#FFFFFF"/>
  <rect x="200" y="20" width="500" height="30" rx="6" fill="#534AB7"/>
  <text x="450" y="40" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Your specific ask ("build a churn-risk monitoring screen")</text>
  <rect x="200" y="55" width="500" height="26" rx="6" fill="#E6F1FB"/>
  <text x="450" y="73" font-family="Arial" font-size="11" fill="#042C53" text-anchor="middle">States — full text, include for any data screen</text>
  <rect x="200" y="86" width="500" height="26" rx="6" fill="#FAEEDA"/>
  <text x="450" y="104" font-family="Arial" font-size="11" fill="#412402" text-anchor="middle">Components — full text, but pick only what this screen needs</text>
  <rect x="200" y="117" width="500" height="26" rx="6" fill="#EAF3DE"/>
  <text x="450" y="135" font-family="Arial" font-size="11" fill="#173404" text-anchor="middle">Layout — full text, always include</text>
  <rect x="200" y="148" width="500" height="26" rx="6" fill="#FCEBEB"/>
  <text x="450" y="166" font-family="Arial" font-size="11" fill="#501313" text-anchor="middle">Accessibility — full text, always include</text>
  <rect x="200" y="179" width="500" height="26" rx="6" fill="#F1EFE8"/>
  <text x="450" y="197" font-family="Arial" font-size="11" fill="#2C2C2A" text-anchor="middle">Foundations — full text, always include</text>
  <text x="450" y="230" font-family="Arial" font-size="11" fill="#888780" text-anchor="middle">Every layer below the ask is the actual rule text, not a summary — an agent can't follow a summary precisely</text>
  </svg>
  </div>

  <h2>Why the full text, not a summary</h2>
  <p>A one-line description like "restrained neutral-first color system" gives an AI agent nothing to measure against — it will invent its own numbers. The block below pastes the <em>actual</em> rules from each section word for word: exact hex-adjacent values, pixel sizes, and thresholds. It's longer than a summary, but it's the difference between a screen that follows the guide and one that just resembles it.</p>

  <h2>The layered approach</h2>
  <p>The core block below (Foundations + Layout + Accessibility) rarely changes — paste it once at the start of a project or chat. For each new screen, keep only the relevant COMPONENTS bullets and the STATES block, then write your actual request underneath. See Parts 2, 3, and 6 for the full reasoning and do/don't examples behind each rule below.</p>

  <h2>Prompting an AI coding agent — the full core block</h2>
  <p>Paste everything below except the COMPONENTS menu items you don't need for this screen. Delete the component bullets that don't apply — don't leave irrelevant ones in, it just dilutes the ones that matter.</p>
  <blockquote class="prompt">You are building a screen for a statistical dashboard. Follow every rule below exactly — these are fixed constraints, not stylistic suggestions.

FOUNDATIONS
- Use a restrained color system: neutrals (grays, white, near-black text) for 80%+ of the UI — backgrounds, borders, body text. Use exactly these semantic colors and never repurpose them: green = success/positive, amber = warning, red = error/negative, blue = informational/selected. Always pair a status color with an icon or text label, never color alone. Use the brand accent color [insert this product's brand hex code] only for the primary action button and active navigation state — never on card backgrounds, large surfaces, or decorative elements. [If this product needs dark mode, paste the dedicated dark-mode block from Style Presets instead of inverting these light-mode values.]
- Use exactly this type scale and nothing outside it, corner radius, spacing scale, and elevation style: [paste your chosen preset's block from Style Presets here — Dense & Efficient, Balanced, or Spacious & Calm]. Lay out multi-card sections on a 12-column grid. One font family throughout. Body line-height 1.4–1.6. Tighter spacing between related elements, looser spacing between unrelated sections, using only the values in the chosen preset — never an arbitrary pixel value.
- Use a single, consistent icon set throughout. Size scale only: 16px inline with text, 20px in buttons and navigation, 24px for standalone icons. Never use an icon alone to communicate status, action, or meaning — always pair it with a visible text label.
- Use exactly three motion durations: 100–150ms ease-out for hover/press/toggle micro-interactions, 200–250ms ease-in-out for dropdowns/modals/tooltips, 300–350ms ease-in-out for page-level transitions. Never exceed 350ms. Do not animate initial page load (use a loading skeleton instead) or routine background data refreshes (update silently, in place). No decorative animation.

LAYOUT
- Structure every page with the same anatomy: a persistent sidebar for global navigation only, a topbar with page title and user controls, a page header with the primary action aligned right, a filters row scoping the data, and the content area below. Never place page-specific actions or filters inside the sidebar.
- Design responsively with three breakpoints: desktop (&gt;1200px) shows the full labeled sidebar and multi-column grids; tablet (768–1200px) collapses the sidebar to icons only and drops to a single column; mobile (&lt;768px) replaces the sidebar with a hamburger menu and converts data tables into stacked cards.
- Identify the single most important metric, alert, or decision this screen exists to support, and give it the largest size, strongest contrast, and top-left position, visible without scrolling. Treat related comparisons/trends as secondary. Treat metadata (timestamps, filters applied, record counts) as tertiary — smallest, lowest-contrast, never competing with the primary metric.

ACCESSIBILITY
- Ensure all text meets WCAG AA contrast (4.5:1 normal, 3:1 large) — including chart labels, table headers, and placeholder text. Use one consistent date format and one consistent numeric precision across the product, with units always shown. Write all labels, empty states, and error messages in plain language — name features by what the user does with them, and make every error message explain what happened and how to fix it.

COMPONENTS — include only the bullets this screen actually needs
- Tables: sticky header that stays visible on scroll, paginate at 25–50 rows rather than rendering everything or using infinite scroll. Visible sort indicator on the sorted column, sensible default sort. Truncate overflowing text with an ellipsis and show the full value in a tooltip on hover.
- Charts: choose chart type by data relationship, not preference — line for trends over time, bar for comparing categories, donut (max 5 slices) for part-to-whole, histogram for distributions. Label series directly when 4 or fewer, otherwise use a legend. Colorblind-safe palette (e.g. blue/orange, not red/green), axes always labeled with units.
- KPI/stat cards: each card needs a plain-language label, the value as the largest element, a delta chip showing direction and magnitude, and explicit comparison-period text (e.g. "vs. last month"). Keep the card background/border neutral regardless of trend direction — apply semantic color only to the delta chip, never the whole card.
- Filters: place all filters directly above the data they affect, never on a separate page or hidden panel. Render every active filter as a removable chip with an ✕. Show date ranges as explicit text (e.g. "Last 30 days") and include "Clear all" once more than one filter is active.
- Forms: label above the field, never placeholder-only. Mark required fields with a visible asterisk and the word "required," not color alone. Validate on blur, not every keystroke. Invalid fields show a red border, warning icon, and a specific error message explaining the fix.
- Navigation: persistent sidebar for primary nav, in-page tabs for secondary nav — never nest more than these two levels. Indicate the active item with both a background fill and a left border accent, not text color alone. Show breadcrumbs only two or more levels deep.
- Buttons: exactly four levels — primary (filled brand color, one per view), secondary (outlined/neutral, any number), tertiary (text-only, low-stakes), destructive (red text/outline by default, solid red reserved for confirmation dialogs only). Disabled buttons show reduced opacity. Actions over 400ms show a loading spinner and become non-clickable. Destructive actions require a confirmation naming the specific records/count affected.
- Modals: centered modal only for confirmations and focused single-record forms; a side drawer for viewing/editing details while keeping the list visible; inline expansion for showing more detail about one item in place. Size to content (confirmations ~400–480px, forms ~560–640px), dismissible via backdrop/Esc/close button, with unsaved-changes confirmation before discarding. Never stack modals.
- Notifications: transient toast (top-right, auto-dismissing) only to confirm a just-completed action. Persistent banner for any ongoing condition tied to page state, staying until resolved or explicitly dismissed. Success/info toasts auto-dismiss after 4–5s, warnings after 6–8s, errors never auto-dismiss.
- Data export: export controls placed directly next to the data they export, never buried in a generic menu. CSV for raw tabular data, PDF for formatted reports with charts. Exported data must respect currently active filters/date range/sort — never export the full unfiltered dataset. Exports over 2–3 seconds run in the background with a toast confirmation, not a blocking spinner.

STATES — include for any screen showing data
- Design all of these, not just the happy path: first-use empty state (with an action to create the first item), filtered-to-zero-results empty state (with a "clear filters" action), loading state using skeleton shapes matching the real layout, error state with a plain-language explanation and retry action, partial-data state showing what loaded while flagging what failed, a non-disruptive real-time update indicator, and a permission-denied state visually distinct from a not-found state.

Now build: [insert your specific screen request here]</blockquote>

  <h2>Reviewer checklist</h2>
  <ul class="checklist">
    <li>Did you replace both bracketed placeholders — the brand hex code and the chosen preset block — before pasting, rather than leaving them as literal text?</li>
    <li>Did you paste the actual rule text, not a paraphrased summary of it?</li>
    <li>Did you delete the COMPONENTS bullets that don't apply to this screen, instead of leaving all six in?</li>
    <li>Is the specific ask clear about the primary metric or purpose (see Pre-prompt checklist)?</li>
    <li>If the agent's output still breaks a rule, quote the exact sentence from the rule back to it — not a rephrased version — when asking for a fix.</li>
  </ul>
  <footer class="panel-footer"><span>Dashboard UX Guide</span><span>Part 1 · Section 3 of 4 — Prompt scaffolding</span></footer>
`,



"post-gen-qa": `
  <div class="part-kicker">Part 1 — Working with AI agents</div>
  <h1>Post-generation QA checklist</h1>
  <p>A checklist you can run without any design vocabulary — just look at the screen and answer each question honestly.</p>

  <div class="diagram-wrap">
  <svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <title>Review flow: look, compare, describe, re-prompt</title>
  <rect width="900" height="200" fill="#FFFFFF"/>
  <g font-family="Arial" text-anchor="middle">
  <circle cx="120" cy="90" r="38" fill="#185FA5"/>
  <text x="120" y="97" font-size="16" font-weight="700" fill="#FFFFFF">Look</text>
  <text x="120" y="150" font-size="11" fill="#888780">5 seconds, no reading</text>
  <path d="M170 90 L270 90" stroke="#B4B2A9" stroke-width="2" marker-end="url(#a2)"/>

  <circle cx="330" cy="90" r="38" fill="#3B6D11"/>
  <text x="330" y="97" font-size="16" font-weight="700" fill="#FFFFFF">Compare</text>
  <text x="330" y="150" font-size="11" fill="#888780">vs. other screens</text>
  <path d="M380 90 L480 90" stroke="#B4B2A9" stroke-width="2" marker-end="url(#a2)"/>

  <circle cx="540" cy="90" r="38" fill="#854F0B"/>
  <text x="540" y="97" font-size="16" font-weight="700" fill="#FFFFFF">Describe</text>
  <text x="540" y="150" font-size="11" fill="#888780">what looks wrong, plainly</text>
  <path d="M590 90 L690 90" stroke="#B4B2A9" stroke-width="2" marker-end="url(#a2)"/>

  <circle cx="750" cy="90" r="38" fill="#A32D2D"/>
  <text x="750" y="97" font-size="14" font-weight="700" fill="#FFFFFF">Re-prompt</text>
  <text x="750" y="150" font-size="11" fill="#888780">cite the specific rule</text>
  </g>
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#B4B2A9"/></marker></defs>
  </svg>
  </div>

  <h2>The non-designer-friendly pass</h2>
  <ol>
    <li><strong>Look</strong> for 5 seconds without reading any text — can you tell what matters?</li>
    <li><strong>Compare</strong> against another screen in the product — same colors, spacing, and components?</li>
    <li><strong>Describe</strong> anything that feels off in plain language ("this button feels too loud," "I can't tell what's clickable") — you don't need design terms.</li>
    <li><strong>Re-prompt</strong> by pointing the agent at the specific rule it broke, rather than re-describing the whole screen from scratch.</li>
  </ol>

  <h2>Describing a fix without design vocabulary</h2>
  <div class="diagram-wrap">
  <svg viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
